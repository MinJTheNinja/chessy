<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조선 궁궐의 여섯 친구 · EasyMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --hanji:#F8F2E8;
  --meok:#1F3348;
  --noerok:#2F6B62;
  --jinsa:#B4483C;
  --geum:#C9A24A;
  --easyblue:#6197D0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Gowun Dodum',sans-serif;
  background:
    radial-gradient(circle at 15% 20%, rgba(201,162,74,.12), transparent 42%),
    radial-gradient(circle at 85% 80%, rgba(97,151,208,.12), transparent 42%),
    var(--hanji);
  color:var(--meok);
  display:flex;align-items:center;justify-content:center;padding:12px;
}
#app{
  width:100%;max-width:520px;background:#FFFCF5;
  border:3px solid var(--meok);border-radius:26px;
  box-shadow:0 10px 0 rgba(31,51,72,.18);
  overflow:hidden;position:relative;display:flex;flex-direction:column;min-height:660px;
}
.top-band{
  height:14px;
  background:repeating-linear-gradient(90deg,
    var(--jinsa) 0 28px, var(--geum) 28px 40px,
    var(--noerok) 40px 68px, var(--geum) 68px 80px,
    var(--easyblue) 80px 108px, var(--geum) 108px 120px);
}
.scene{flex:1;display:none;flex-direction:column;padding:20px 22px 18px}
.scene.active{display:flex;animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2,.jua{font-family:'Jua',sans-serif;letter-spacing:.5px}
h1{font-size:30px;line-height:1.25;text-align:center}
h2{font-size:24px}
img{display:block;width:100%;height:100%;object-fit:contain}
.eyebrow{
  font-family:'Jua',sans-serif;font-size:13px;color:#fff;
  background:var(--noerok);border-radius:999px;padding:4px 14px;align-self:center;margin-bottom:10px;
}
.title-art{margin:6px auto 0;width:200px;height:200px}
.title-sub{text-align:center;font-size:15px;line-height:1.7;margin-top:8px;color:#4a5568}
.start-btn{
  margin:18px auto 6px;display:block;font-family:'Jua',sans-serif;font-size:21px;color:#fff;
  background:var(--jinsa);border:none;border-radius:999px;padding:14px 44px;cursor:pointer;
  box-shadow:0 5px 0 #82322a;transition:transform .1s;
}
.start-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #82322a}
.brand{text-align:center;font-size:12px;color:var(--easyblue);margin-top:auto;padding-top:10px;font-family:'Jua',sans-serif}

.char-row{display:flex;align-items:flex-end;gap:12px;margin-bottom:6px}
.char-art{width:112px;height:112px;flex-shrink:0;animation:bounce 3s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.char-text{flex:1;padding-bottom:6px}
.speech{
  position:relative;background:#fff;border:2.5px solid var(--meok);border-radius:18px;
  padding:12px 14px;font-size:14.5px;line-height:1.6;
}
.speech::before{content:"";position:absolute;left:-12px;bottom:22px;border:8px solid transparent;border-right-color:var(--meok)}
.speech::after{content:"";position:absolute;left:-8px;bottom:24px;border:6px solid transparent;border-right-color:#fff}
.speech b{color:var(--jinsa)}
.char-name{font-family:'Jua',sans-serif;font-size:18px;margin-bottom:4px}
.char-name small{font-size:12px;color:var(--easyblue);margin-left:6px}

.board-wrap{margin:10px auto 4px;position:relative}
.board{
  display:grid;grid-template-columns:repeat(5,1fr);
  width:min(290px,74vw);aspect-ratio:1;
  border:3px solid var(--meok);border-radius:12px;overflow:hidden;touch-action:manipulation;
}
.sq{position:relative}
.sq.light{background:#FBF4E4}
.sq.dark{background:#E0CFA9}
.sq.hint{cursor:pointer}
.sq.hint::after{
  content:"";position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;
  background:var(--easyblue);opacity:.85;animation:pulse 1.2s ease-in-out infinite;
}
.sq.hint.capture-target::after{
  left:21%;top:21%;width:58%;height:58%;
  background:rgba(97,151,208,.28);border:3px solid var(--easyblue);
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.sq.wrong{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.piece-token{
  position:absolute;width:20%;aspect-ratio:1;pointer-events:none;z-index:5;
  transition:left .45s cubic-bezier(.34,1.4,.64,1), top .45s cubic-bezier(.34,1.4,.64,1);
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.28));
}
.mission{text-align:center;font-family:'Jua',sans-serif;font-size:15.5px;color:var(--noerok);margin-top:10px;min-height:24px}
.mission.done{color:var(--jinsa)}
.star-burst{position:absolute;font-size:26px;pointer-events:none;z-index:9;animation:burst .8s ease-out forwards}
@keyframes burst{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.8) translateY(-30px);opacity:0}}
.enemy-token.poof{animation:poof .42s ease-out forwards}
@keyframes poof{0%{transform:scale(1);opacity:1}55%{transform:scale(1.35) rotate(8deg);opacity:.72}100%{transform:scale(.15) translateY(-24px);opacity:0}}
.rush-progress{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:#fff;border:2px solid var(--meok);border-radius:14px;
  padding:9px 12px;margin:8px auto 0;width:min(330px,86vw);
  font-family:'Jua',sans-serif;font-size:14px;
}
.rush-progress strong{color:var(--jinsa)}
.lesson-note{font-size:13px;line-height:1.55;text-align:center;color:#4a5568;margin-top:4px}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px}
.nav button{font-family:'Jua',sans-serif;font-size:17px;border:none;border-radius:999px;padding:11px 26px;cursor:pointer;transition:transform .1s}
.nav button:active{transform:scale(.95)}
.btn-next{background:var(--meok);color:#fff;box-shadow:0 4px 0 #0e1c2c}
.btn-next:disabled{background:#b9c0cc;box-shadow:0 4px 0 #99a1ad;cursor:not-allowed}
.btn-prev{background:transparent;color:var(--meok);text-decoration:underline;padding:11px 10px}
.dots{display:flex;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#dbcfb3}
.dot.on{background:var(--geum)}

.rel-stage{position:relative;width:min(330px,86vw);aspect-ratio:1;margin:4px auto}
.rel-node{position:absolute;width:86px;height:104px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s}
.rel-node:hover{transform:translate(-50%,-50%) scale(1.09)}
.rel-node .art{width:76px;height:76px}
.rel-node span{font-family:'Jua',sans-serif;font-size:12px;background:#fff;border:2px solid var(--meok);border-radius:8px;padding:1px 7px;margin-top:-4px;white-space:nowrap}
.rel-node.selected .art{filter:drop-shadow(0 0 9px var(--geum))}
.rel-line{stroke:var(--geum);stroke-width:3;stroke-dasharray:6 6;opacity:.5}
.rel-bubble{min-height:76px;background:#fff;border:2.5px solid var(--meok);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.6;margin-top:2px}
.rel-bubble .jua{color:var(--jinsa);font-size:15px}

.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 2px}
.badge{background:#fff;border:2.5px solid var(--meok);border-radius:16px;padding:8px 4px 6px;text-align:center}
.badge .art{width:100%;height:66px}
.badge p{font-family:'Jua',sans-serif;font-size:13px;margin-top:2px}
.badge.locked{opacity:.32;filter:grayscale(1)}
.badge.earned{animation:pop .5s cubic-bezier(.34,1.6,.64,1)}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
.final-msg{text-align:center;font-size:15px;line-height:1.7;margin-top:4px}
.replay{margin:12px auto 0;display:block;font-family:'Jua',sans-serif;font-size:17px;background:var(--easyblue);color:#fff;border:none;border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 4px 0 #3f6f9f}
.replay:active{transform:translateY(3px);box-shadow:0 1px 0 #3f6f9f}

/* ---------- 챕터 관련 ---------- */
.chapters-btn{margin:12px auto 0;display:block;font-family:'Jua',sans-serif;font-size:16px;color:#fff;background:var(--jinsa);border:none;border-radius:999px;padding:12px 28px;cursor:pointer;box-shadow:0 4px 0 #82322a;transition:transform .1s}
.chapters-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #82322a}
.ch-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 2px;flex:1}
.ch-card{position:relative;background:#fff;border:2.5px solid var(--meok);border-radius:16px;padding:12px 8px 10px;text-align:center;cursor:pointer;transition:transform .12s}
.ch-card:active{transform:scale(.96)}
.ch-card-art{width:100%;height:72px;margin-bottom:2px}
.ch-card-num{font-family:'Jua',sans-serif;font-size:11px;color:var(--easyblue)}
.ch-card-title{font-family:'Jua',sans-serif;font-size:15px;margin-top:1px;line-height:1.25}
.ch-card-sub{font-size:11.5px;color:#6b7686;margin-top:3px}
.ch-card.earned{border-color:var(--noerok)}
.ch-card-done{position:absolute;top:6px;right:8px;font-family:'Jua',sans-serif;font-size:11px;color:var(--noerok)}

.sq.sq-danger::before{content:"";position:absolute;inset:0;background:rgba(180,72,60,.15);pointer-events:none}
.enemy-token{filter:sepia(1) saturate(4.5) hue-rotate(-42deg) brightness(.82)}
.king-danger::before{content:"";position:absolute;inset:-12%;border-radius:50%;box-shadow:0 0 0 3px rgba(180,72,60,.6);animation:dangerPulse 1s ease-in-out infinite}
@keyframes dangerPulse{0%,100%{box-shadow:0 0 0 3px rgba(180,72,60,.6)}50%{box-shadow:0 0 0 9px rgba(180,72,60,.12)}}

button:focus-visible{outline:3px solid var(--geum);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div class="top-band"></div>
  <div id="scenes"></div>
</div>

const rays = (dirs)=>{
  const out=[];
  for(const [dr,dc] of dirs){
    let r=2+dr,c=2+dc;
    while(r>=0&&r<5&&c>=0&&c<5){out.push([r,c]);r+=dr;c+=dc;}
  }
  return out;
};

function dots(cur){
  let h='<div class="dots">';
  for(let i=0;i<totalPieceScenes;i++) h+=`<div class="dot ${i<=cur?'on':''}"></div>`;
  return h+'</div>';
}
function progressDots(total, cur){
  let h='<div class="dots">';
  for(let i=0;i<total;i++) h+=`<div class="dot ${i<=cur?'on':''}"></div>`;
  return h+'</div>';
}
function notifyTutorialComplete(){
  if(window.parent&&window.parent!==window){
    window.parent.postMessage({type:'easymate:tutorial-complete'}, window.location.origin);
  }
}
function render(){
  const s = state.scene;
  let html='';
  if(s===0) html = titleScene();
  else if(s>=1 && s<=totalPieceScenes) html = pieceScene(PIECES[s-1], s-1);
  else if(s>=CAPTURE_START_SCENE && s<CAPTURE_START_SCENE+CAPTURE_SCENES.length) html = captureScene(CAPTURE_SCENES[s-CAPTURE_START_SCENE], s-CAPTURE_START_SCENE);
  else if(s===PUZZLE_RUSH_SCENE) html = puzzleRushScene();
  else if(s===CHECKMATE_SCENE) html = checkmateScene();
  else if(s===MINI_GAME_SCENE) html = miniGameScene();
  else if(s===REL_SCENE) html = relScene();
  else if(s===BADGE_SCENE) html = badgeScene();
  else if(s===CHAPTER_SELECT_SCENE) html = chapterSelectScene();
  else if(s===CHAPTER_START_SCENE) html = chapter1Scene();
  else if(s===CHAPTER_START_SCENE+1) html = chapter2Scene();
  else if(s===CHAPTER_START_SCENE+2) html = chapter3Scene();
  else if(s===CHAPTER_START_SCENE+3) html = chapter4Scene();

  root.innerHTML = `<div class="scene active">${html}</div>`;

}

function setupBoard(p){
  const board = document.getElementById('board');
  const start = p.start;
  const targets = new Set(p.moves.map(([r,c])=>r+','+c));
  for(let r=0;r<5;r++) for(let c=0;c<5;c++){
    const sq=document.createElement('div');
    sq.className='sq '+((r+c)%2?'dark':'light');
    sq.dataset.rc=r+','+c;
    if(targets.has(r+','+c) && !(r===start[0]&&c===start[1])) sq.classList.add('hint');
    board.appendChild(sq);
  }
  const pieceEl=document.createElement('div');
  pieceEl.className='piece-token';
  pieceEl.innerHTML=ART[p.id];
  board.appendChild(pieceEl);
  placeToken(pieceEl,start);
  let done=false;
  board.addEventListener('click',e=>{
    const sq=e.target.closest('.sq');
    if(!sq||done) return;
    const [r,c]=sq.dataset.rc.split(',').map(Number);
    const m=document.getElementById('mission');
    if(sq.classList.contains('hint')){
      done=true;
      placeToken(pieceEl,[r,c]);
      board.querySelectorAll('.sq.hint').forEach(el=>el.classList.remove('hint'));
      celebrate(sq);
      m.textContent='참 잘했어요! 배지를 획득했어!';
      m.classList.add('done');
      state.earned[p.id]=true;
      document.getElementById('nextBtn').disabled=false;
    }else{
      sq.classList.remove('wrong'); void sq.offsetWidth; sq.classList.add('wrong');
      m.textContent='앗! 거긴 못 가는 곳이야. 파란 점을 눌러봐!';
      setTimeout(()=>{ if(!done) m.textContent=p.mission; },1500);
    }
  });
}
function placeToken(el,[r,c]){ el.style.left=(c*20)+'%'; el.style.top=(r*20)+'%'; }
function celebrate(sq){
  const board=document.getElementById('board');
  const rect=sq.getBoundingClientRect(), brect=board.getBoundingClientRect();
  for(let i=0;i<3;i++){
    const s=document.createElement('div');
    s.className='star-burst'; s.textContent='★';
    s.style.color=['#C9A24A','#B4483C','#6197D0'][i];
    s.style.left=(rect.left-brect.left + rect.width/2 - 12 + (i-1)*18)+'px';
    s.style.top=(rect.top-brect.top + rect.height/2 - 16)+'px';
    s.style.animationDelay=(i*0.08)+'s';
    board.appendChild(s);
    setTimeout(()=>s.remove(),900);
  }
}

function makeGrid(board){
  board.innerHTML='';

    const sq=document.createElement('div');
    sq.className='sq '+((r+c)%2?'dark':'light');
    sq.dataset.rc=r+','+c;
    board.appendChild(sq);
  }
}
function sqAt(board,r,c){ return board.querySelector(`.sq[data-rc="${r},${c}"]`); }
function addToken(board,piece,at,extraClass=''){
  const token=document.createElement('div');
  token.className=('piece-token '+extraClass).trim();
  token.innerHTML=ART[piece];
  board.appendChild(token);
  placeToken(token,at);
  return token;
}
function sameSquare(a,b){ return a[0]===b[0] && a[1]===b[1]; }
function flashWrong(sq,message,resetMessage){
  const m=document.getElementById('mission');
  sq.classList.remove('wrong'); void sq.offsetWidth; sq.classList.add('wrong');
  m.textContent=message;
  setTimeout(()=>{ if(!m.classList.contains('done')) m.textContent=resetMessage; },1400);
}
function shuffle(items){
  const out=[...items];
  for(let i=out.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [out[i],out[j]]=[out[j],out[i]];
  }
  return out;
}

function setupCapture(c){
  const board=document.getElementById('board');
  makeGrid(board);
  const token=addToken(board,c.piece,c.start);
  const enemy=addToken(board,c.enemy,c.target,'enemy-token');
  const targetSq=sqAt(board,c.target[0],c.target[1]);
  targetSq.classList.add('hint','capture-target');
  (c.decoys||[]).forEach(([r,cc])=>sqAt(board,r,cc).classList.add('sq-danger'));
  let done=false;
  board.addEventListener('click', e=>{
    const sq=e.target.closest('.sq'); if(!sq||done) return;
    const spot=sq.dataset.rc.split(',').map(Number);
    const m=document.getElementById('mission');
    if(sameSquare(spot,c.target)){
      done=true;
      board.querySelectorAll('.sq.hint').forEach(el=>el.classList.remove('hint','capture-target'));
      placeToken(token,c.target);
      enemy.classList.add('poof');
      setTimeout(()=>enemy.remove(),430);
      celebrate(sq);
      m.textContent='잡았어요! 내 말이 그 칸을 차지했어요.';
      m.classList.add('done');
      state.captures[c.id]=true;
      document.getElementById('nextBtn').disabled=false;
    }else{
      flashWrong(sq,c.wrong||'그 칸은 이번 잡기 길이 아니에요. 파란 점 위의 적을 탭해요!',c.mission);
    }
  });
}

function setupPuzzleRush(){
  const board=document.getElementById('board');
  const nextBtn=document.getElementById('nextBtn');
  if(!state.puzzleOrder) {
    state.puzzleOrder=shuffle(PUZZLES.map((_,i)=>i));
    state.puzzleIndex=0;
    state.puzzleScore=0;
    state.puzzleEarned=false;
  }
  if(state.puzzleEarned) nextBtn.disabled=false;

  const renderPuzzle=()=>{
    const puzzle=PUZZLES[state.puzzleOrder[state.puzzleIndex]];
    const prompt=document.getElementById('rushPrompt');
    const count=document.getElementById('rushCount');
    const mission=document.getElementById('mission');
    makeGrid(board);
    prompt.textContent=puzzle.prompt;
    count.textContent=`${Math.min(state.puzzleScore,PUZZLES.length)}/${PUZZLES.length}`;
    mission.classList.remove('done');
    mission.textContent=state.puzzleEarned ? '퍼즐 러시 완료! 다음으로 넘어가요.' : '파란 점이나 정답 말을 탭해요.';
    board.onclick=null;
    if(state.puzzleEarned) return;

    let locked=false;
    const complete=(message,sq)=>{
      if(locked) return;
      locked=true;
      celebrate(sq);
      state.puzzleScore++;
      count.textContent=`${state.puzzleScore}/${PUZZLES.length}`;
      mission.textContent=message;
      mission.classList.add('done');
      if(state.puzzleIndex>=PUZZLES.length-1){
        state.puzzleEarned=true;
        nextBtn.disabled=false;
        setTimeout(()=>{ mission.textContent='퍼즐 러시 완료! 이제 체크메이트를 배워요.'; },650);
      }else{
        setTimeout(()=>{ state.puzzleIndex++; renderPuzzle(); },760);
      }
    };

    if(puzzle.type==='capture'){
      const token=addToken(board,puzzle.piece,puzzle.start);
      const enemy=addToken(board,puzzle.enemy,puzzle.target,'enemy-token');
      const targetSq=sqAt(board,puzzle.target[0],puzzle.target[1]);
      targetSq.classList.add('hint','capture-target');
      board.onclick=e=>{
        const sq=e.target.closest('.sq'); if(!sq||locked) return;
        const spot=sq.dataset.rc.split(',').map(Number);
        if(sameSquare(spot,puzzle.target)){
          placeToken(token,puzzle.target);
          enemy.classList.add('poof');
          setTimeout(()=>enemy.remove(),430);
          targetSq.classList.remove('hint','capture-target');
          complete(puzzle.done,sq);
        }else{
          flashWrong(sq,'이번 문제의 정답 칸은 파란 점이에요.',puzzle.prompt);
        }
      };
    }

    if(puzzle.type==='safe'){
      puzzle.danger.forEach(([r,c])=>sqAt(board,r,c).classList.add('sq-danger'));
      addToken(board,puzzle.enemy,puzzle.enemyAt,'enemy-token');
      const king=addToken(board,puzzle.piece,puzzle.start,'king-danger');
      const targetSq=sqAt(board,puzzle.target[0],puzzle.target[1]);
      targetSq.classList.add('hint');
      board.onclick=e=>{
        const sq=e.target.closest('.sq'); if(!sq||locked) return;
        const spot=sq.dataset.rc.split(',').map(Number);
        if(sameSquare(spot,puzzle.target)){
          placeToken(king,puzzle.target);
          king.classList.remove('king-danger');
          targetSq.classList.remove('hint');
          complete(puzzle.done,sq);
        }else{
          flashWrong(sq,puzzle.wrong,puzzle.prompt);
        }
      };
    }

    if(puzzle.type==='reach'){
      const targetSq=sqAt(board,puzzle.target[0],puzzle.target[1]);
      targetSq.classList.add('hint');
      puzzle.choices.forEach(choice=>addToken(board,choice.piece,choice.at));
      board.onclick=e=>{
        const sq=e.target.closest('.sq'); if(!sq||locked) return;
        const spot=sq.dataset.rc.split(',').map(Number);
        const choice=puzzle.choices.find(item=>sameSquare(item.at,spot));
        if(choice&&choice.correct){
          const token=[...board.querySelectorAll('.piece-token')][puzzle.choices.indexOf(choice)];
          placeToken(token,puzzle.target);
          targetSq.classList.remove('hint');
          complete(puzzle.done,targetSq);
        }else{
          flashWrong(sq,'그 말은 이번 파란 점에 닿을 수 없어요.',puzzle.prompt);
        }
      };
    }
  };
  renderPuzzle();
}

function setupCheckmate(){
  const board=document.getElementById('board');
  makeGrid(board);
  const rook=addToken(board,'rook',[0,0]);
  addToken(board,'king',[2,3]);
  const enemyKing=addToken(board,'king',[0,4],'enemy-token king-danger');
  const target=[0,1];
  sqAt(board,target[0],target[1]).classList.add('hint');
  let done=false;
  board.addEventListener('click',e=>{
    const sq=e.target.closest('.sq'); if(!sq||done) return;
    const spot=sq.dataset.rc.split(',').map(Number);
    const m=document.getElementById('mission');
    if(sameSquare(spot,target)){
      done=true;
      placeToken(rook,target);
      sq.classList.remove('hint');
      [[0,4],[0,3],[1,3],[1,4]].forEach(([r,c])=>sqAt(board,r,c).classList.add('sq-danger'));
      enemyKing.classList.add('king-danger');
      celebrate(sqAt(board,0,4));
      m.textContent='체크메이트! 상대 왕에게 안전한 칸이 하나도 없어요.';
      m.classList.add('done');
      state.checkmateEarned=true;
      document.getElementById('nextBtn').disabled=false;
    }else{
      flashWrong(sq,'수문장을 파란 점으로 보내면 구석 왕의 길이 막혀요.', '수문장을 파란 점으로 보내 상대 왕의 도망길을 막아보자!');
    }
  });
}

  const pawn=addToken(board,'pawn',[3,1]);

  const enemy=addToken(board,'pawn',[2,2],'enemy-token');
  const target=[2,2];
  sqAt(board,target[0],target[1]).classList.add('hint','capture-target');
  let done=false;
  board.addEventListener('click',e=>{
    const sq=e.target.closest('.sq'); if(!sq||done) return;
    const spot=sq.dataset.rc.split(',').map(Number);
    const m=document.getElementById('mission');
    if(sameSquare(spot,target)){
      done=true;
      placeToken(pawn,target);
      enemy.classList.add('poof');
      setTimeout(()=>enemy.remove(),430);
      sq.classList.remove('hint','capture-target');
      celebrate(sq);
      m.textContent='좋아요! 작은 판에서 한 수씩 두면 전체 게임도 덜 어렵게 시작할 수 있어요.';

      document.getElementById('nextBtn').disabled=false;
    }else{
      flashWrong(sq,'첫 수는 파란 점 위의 적을 잡는 연습이에요.', '첫 수: 병졸로 파란 점 위의 적을 잡고 미니 게임을 시작해요.');
    }
  });
}

/* ---- 챕터 1: 병졸이 걸어서 끝까지 가면 변신 ---- */
function setupChapter1(){
  const board=document.getElementById('board');
  makeGrid(board);
  const path=[[3,2],[2,2],[1,2],[0,2]];
  let idx=0, done=false;
  const token=document.createElement('div');
  token.className='piece-token'; token.innerHTML=ART.pawn;
  board.appendChild(token);
  placeToken(token,[4,2]);
  function markHint(){ sqAt(board,path[idx][0],path[idx][1]).classList.add('hint'); }
  markHint();
  board.addEventListener('click', e=>{
    const sq=e.target.closest('.sq'); if(!sq||done) return;
    const m=document.getElementById('mission');
    if(sq.classList.contains('hint')){
      placeToken(token, path[idx]);
      sq.classList.remove('hint');
      idx++;
      if(idx<path.length){
        markHint();
        m.textContent = ['좋아! 한 걸음 더!','계속 가보자!','거의 다 왔어!'][idx-1] || '계속 가보자!';
      }else{
        done=true;
        celebrate(sq);
        setTimeout(()=>{
          token.style.transition='transform .45s';
          token.style.transform='scale(1.35)';
          token.innerHTML=ART.queen;
          setTimeout(()=>{ token.style.transform='scale(1)'; celebrate(sq); },420);
        },250);
        m.textContent='와! 병졸이 장군님이 되었어요!';
        m.classList.add('done');
        state.chapterEarned.ch1=true;
        document.getElementById('nextBtn').disabled=false;
      }
    }else{
      sq.classList.remove('wrong'); void sq.offsetWidth; sq.classList.add('wrong');
      m.textContent='앗! 그 자리가 아니야. 파란 점을 따라가 보자!';
    }
  });
}

/* ---- 챕터 2: 시작할 때만 두 칸 전진 ---- */
function setupChapter2(){
  const board=document.getElementById('board');
  makeGrid(board);
  const start=[3,2], target=[1,2];
  const token=document.createElement('div');
  token.className='piece-token'; token.innerHTML=ART.pawn;
  board.appendChild(token);
  placeToken(token,start);
  sqAt(board,target[0],target[1]).classList.add('hint');
  let done=false;
  board.addEventListener('click', e=>{
    const sq=e.target.closest('.sq'); if(!sq||done) return;
    const m=document.getElementById('mission');
    const [r,c]=sq.dataset.rc.split(',').map(Number);
    if(r===target[0]&&c===target[1]){
      done=true;
      placeToken(token,target);
      sq.classList.remove('hint');
      celebrate(sq);
      m.textContent='우와, 두 칸을 힘차게 뛰었어요!';
      m.classList.add('done');
      state.chapterEarned.ch2=true;
      document.getElementById('nextBtn').disabled=false;
    }else{
      sq.classList.remove('wrong'); void sq.offsetWidth; sq.classList.add('wrong');
      m.textContent = (r===2&&c===2)
        ? '거기도 갈 수 있지만, 오늘은 두 칸 뛰기에 도전해보자!'
        : '앗! 그 자리가 아니야. 파란 점을 눌러봐!';
    }
  });
}

/* ---- 챕터 3: 왕과 수문장 자리 바꾸기 (캐슬링) ---- */
function setupChapter3(){
  const board=document.getElementById('board');
  makeGrid(board);
  const kingStart=[2,2], rookStart=[2,0];
  const kingTok=document.createElement('div');
  kingTok.className='piece-token'; kingTok.innerHTML=ART.king;
  board.appendChild(kingTok); placeToken(kingTok,kingStart);
  const rookTok=document.createElement('div');
  rookTok.className='piece-token'; rookTok.innerHTML=ART.rook;
  board.appendChild(rookTok); placeToken(rookTok,rookStart);
  sqAt(board,rookStart[0],rookStart[1]).classList.add('hint');
  let done=false;
  board.addEventListener('click', e=>{
    const sq=e.target.closest('.sq'); if(!sq||done) return;
    const m=document.getElementById('mission');
    if(sq.classList.contains('hint')){
      done=true;
      placeToken(kingTok,[2,1]);
      placeToken(rookTok,[2,2]);
      sq.classList.remove('hint');
      celebrate(sq);
      m.textContent='왕과 수문장이 자리를 바꿨어요! (캐슬링)';
      m.classList.add('done');
      state.chapterEarned.ch3=true;
      document.getElementById('nextBtn').disabled=false;
    }else{
      sq.classList.remove('wrong'); void sq.offsetWidth; sq.classList.add('wrong');
      m.textContent='앗! 수문장 자리를 탭 해야 자리를 바꿀 수 있어!';
    }
  });
}

/* ---- 챕터 4: 위험에서 왕을 피신시키기 ---- */
function setupChapter4(){
  const board=document.getElementById('board');
  makeGrid(board);
  const dangerCol=2;
  board.querySelectorAll('.sq').forEach(sq=>{
    const [,c]=sq.dataset.rc.split(',').map(Number);
    if(c===dangerCol) sq.classList.add('sq-danger');
  });
  const enemyTok=document.createElement('div');
  enemyTok.className='piece-token enemy-token'; enemyTok.innerHTML=ART.rook;
  board.appendChild(enemyTok); placeToken(enemyTok,[0,2]);
  const kingTok=document.createElement('div');
  kingTok.className='piece-token king-danger'; kingTok.innerHTML=ART.king;
  board.appendChild(kingTok); placeToken(kingTok,[3,2]);
  const safe=[[3,1],[3,3],[4,1],[4,3]];
  safe.forEach(([r,c])=>sqAt(board,r,c).classList.add('hint'));
  let done=false;
  board.addEventListener('click', e=>{
    const sq=e.target.closest('.sq'); if(!sq||done) return;
    const m=document.getElementById('mission');
    const [r,c]=sq.dataset.rc.split(',').map(Number);
    if(sq.classList.contains('hint')){
      done=true;
      placeToken(kingTok,[r,c]);
      kingTok.classList.remove('king-danger');
      board.querySelectorAll('.sq.hint').forEach(el=>el.classList.remove('hint'));
      celebrate(sq);
      m.textContent='왕이 안전한 곳으로 피신했어요!';
      m.classList.add('done');
      state.chapterEarned.ch4=true;
      document.getElementById('nextBtn').disabled=false;
    }else{
      sq.classList.remove('wrong'); void sq.offsetWidth; sq.classList.add('wrong');
      m.textContent = (c===dangerCol) ? '안돼! 그 줄은 아직 위험해!' : '음, 거긴 아니야. 파란 점을 찾아봐!';
    }
  });
}

function bindScene(){
  const s=state.scene;
  const go=(n)=>{state.scene=n;render();};
  if(s===0){ document.getElementById('startBtn').onclick=()=>go(1); return; }

  if(s>=1&&s<=totalPieceScenes){
    const p=PIECES[s-1];
    setupBoard(p);
    if(state.earned[p.id]) document.getElementById('nextBtn').disabled=false;
    document.getElementById('prevBtn').onclick=()=>go(s-1);
    document.getElementById('nextBtn').onclick=()=>go(s+1);
    return;
  }

  if(s>=CAPTURE_START_SCENE && s<CAPTURE_START_SCENE+CAPTURE_SCENES.length){
    const capture=CAPTURE_SCENES[s-CAPTURE_START_SCENE];
    setupCapture(capture);
    if(state.captures[capture.id]) document.getElementById('nextBtn').disabled=false;
    document.getElementById('prevBtn').onclick=()=>go(s-1);
    document.getElementById('nextBtn').onclick=()=>go(s+1);
    return;
  }

  if(s===PUZZLE_RUSH_SCENE){
    setupPuzzleRush();
    document.getElementById('prevBtn').onclick=()=>go(s-1);
    document.getElementById('nextBtn').onclick=()=>go(s+1);
    return;
  }

  if(s===CHECKMATE_SCENE){
    setupCheckmate();
    if(state.checkmateEarned) document.getElementById('nextBtn').disabled=false;
    document.getElementById('prevBtn').onclick=()=>go(PUZZLE_RUSH_SCENE);
    document.getElementById('nextBtn').onclick=()=>go(MINI_GAME_SCENE);
    return;
  }

  if(s===MINI_GAME_SCENE){
    setupMiniGame();
    if(state.miniGameEarned) document.getElementById('nextBtn').disabled=false;
    document.getElementById('prevBtn').onclick=()=>go(CHECKMATE_SCENE);
    document.getElementById('nextBtn').onclick=()=>go(REL_SCENE);
    return;
  }

  if(s===REL_SCENE){
    document.getElementById('prevBtn').onclick=()=>go(MINI_GAME_SCENE);
    document.getElementById('nextBtn').onclick=()=>go(BADGE_SCENE);
    document.querySelectorAll('.rel-node').forEach(node=>{
      node.addEventListener('click',()=>{
        document.querySelectorAll('.rel-node').forEach(n=>n.classList.remove('selected'));
        node.classList.add('selected');
        const d=REL[node.dataset.id];
        document.getElementById('relBubble').innerHTML=`<span class="jua">${d.label}</span><br>${d.text}`;
      });
    });
    return;
  }

  if(s===BADGE_SCENE){
    document.getElementById('replayBtn').onclick=()=>go(0);
    const toCh=document.getElementById('toChaptersBtn');
    if(toCh) toCh.onclick=()=>go(CHAPTER_SELECT_SCENE);
    return;
  }

  if(s===CHAPTER_SELECT_SCENE){
    document.getElementById('prevBtn').onclick=()=>go(BADGE_SCENE);
    document.querySelectorAll('.ch-card').forEach(card=>{
      card.addEventListener('click',()=>go(parseInt(card.dataset.scene,10)));
    });
    return;
  }

  const chapterSetup = {
    [CHAPTER_START_SCENE]:setupChapter1,
    [CHAPTER_START_SCENE+1]:setupChapter2,
    [CHAPTER_START_SCENE+2]:setupChapter3,
    [CHAPTER_START_SCENE+3]:setupChapter4
  };
  const chapterEarnedKey = {
    [CHAPTER_START_SCENE]:'ch1',
    [CHAPTER_START_SCENE+1]:'ch2',
    [CHAPTER_START_SCENE+2]:'ch3',
    [CHAPTER_START_SCENE+3]:'ch4'
  };
  if(chapterSetup[s]){
    chapterSetup[s]();
    if(state.chapterEarned[chapterEarnedKey[s]]) document.getElementById('nextBtn').disabled=false;
    document.getElementById('prevBtn').onclick=()=>go(CHAPTER_SELECT_SCENE);
    document.getElementById('nextBtn').onclick=()=>go(CHAPTER_SELECT_SCENE);
    return;
  }
}
render();
