<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고려 vs 몽골 · 여섯 용사 이야기 · EasyMate</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --hanji:#F8F2E8;
  --meok:#1F3348;
  --noerok:#2F6B62;
  --jinsa:#B4483C;
  --geum:#C9A24A;
  --easyblue:#6197D0;
  --goryeo:#3E5C94;
  --mongol:#8E3B31;
  --font-korean:var(--font-ui);
  --font-ui:'Pretendard','Noto Sans KR',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%}
body{
  font-family:var(--font-korean);
  font-weight:500;
  background:#FFFCF5;
  color:var(--meok);
  display:flex;align-items:stretch;justify-content:stretch;padding:0;
}
#app{
  width:100%;max-width:none;height:100%;min-height:100%;background:#FFFCF5;
  border:0;border-radius:0;
  box-shadow:none;
  overflow-y:auto;overflow-x:clip;position:relative;display:flex;flex-direction:column;
}
.scene{flex:1;display:none;flex-direction:column;padding:clamp(18px,3vw,34px) clamp(22px,5vw,64px) clamp(18px,3vw,34px)}
.scene.active{display:flex;animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2,.jua{font-family:var(--font-korean);letter-spacing:0}
h1{font-size:30px;line-height:1.25;text-align:center}
h2{font-size:24px}
svg,img{display:block;width:100%;height:100%;object-fit:contain}
.eyebrow{
  font-family:var(--font-korean);font-size:13px;color:#fff;
  background:var(--noerok);border-radius:999px;padding:4px 14px;align-self:center;margin-bottom:10px;
}
.title-art{margin:6px auto 0;width:280px;display:grid;grid-template-columns:1fr 40px 1fr;align-items:end}
.title-art>div{height:166px;display:flex;position:relative;flex-direction:column;align-items:center;justify-content:flex-end}
.title-art>div>img{width:126px;height:138px;flex:0 0 138px}
.title-art .title-vs{align-self:center;font-family:var(--font-korean);font-size:25px;color:var(--jinsa);text-align:center;text-shadow:0 2px 0 #fff}
.title-label{display:block;height:24px;flex:0 0 24px;text-align:center;font-family:var(--font-korean);color:var(--meok);font-size:16px;line-height:24px;margin:0}
.mongol-king-art{position:relative}
.mongol-king-art::before,.mongol-king-art::after{display:none}
.title-sub{text-align:center;font-size:15px;line-height:1.7;margin-top:8px;color:#4a5568}
.start-btn{
  margin:18px auto 6px;display:block;font-family:var(--font-korean);font-size:21px;color:#fff;
  background:var(--jinsa);border:none;border-radius:999px;padding:14px 44px;cursor:pointer;
  box-shadow:0 5px 0 #82322a;transition:transform .1s;
}
.start-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #82322a}
.brand{text-align:center;font-size:12px;color:var(--easyblue);margin-top:auto;padding-top:10px;font-family:var(--font-korean)}

.char-row{display:flex;align-items:flex-end;gap:12px;margin-bottom:6px}
.char-art{width:112px;height:112px;flex-shrink:0}
.char-text{flex:1;padding-bottom:6px}
.speech{
  position:relative;background:#fff;border:2.5px solid var(--meok);border-radius:18px;
  padding:12px 14px;font-size:14.5px;line-height:1.6;
}
.speech::before,.speech::after{display:none}
.speech b{color:var(--jinsa)}
.char-name{font-family:var(--font-korean);font-size:18px;margin-bottom:4px}
.char-name small{font-size:12px;color:var(--easyblue);margin-left:6px}
.warrior-label{display:inline-block;margin-bottom:5px;padding:3px 8px;border-radius:999px;background:var(--goryeo);color:#fff;font-family:var(--font-korean);font-size:12px}
.enemy-row{display:flex;flex-direction:row-reverse;align-items:flex-end;gap:12px;margin:0 0 6px auto;max-width:92%}
.enemy-row .char-text{text-align:right}.enemy-row .speech{border-color:var(--mongol)}
.enemy-row .speech::before{left:auto;right:-12px;border-right-color:transparent;border-left-color:var(--mongol)}
.enemy-row .speech::after{left:auto;right:-8px;border-right-color:transparent;border-left-color:#fff}
.enemy-row .char-name small{color:var(--mongol)}

/* Lesson cards: each faction speaks directly beside its own piece. */
.lesson-layout{display:grid;grid-template-columns:minmax(250px,340px) minmax(0,1fr);gap:clamp(26px,5vw,68px);align-items:start;width:min(980px,100%);margin:auto}
.lesson-board-panel{min-width:0;padding-top:4px}
.lesson-board-label{min-height:30px;margin:0 auto 8px;width:min(340px,36vw);font-family:var(--font-ui);font-size:16px;font-weight:900;color:var(--goryeo);letter-spacing:.01em}
.lesson-board-panel .board-wrap{margin:0 auto 10px}
.lesson-board-panel .board{width:min(340px,36vw)}
.lesson-board-panel .mission{margin:0 auto;text-align:left;width:min(340px,36vw);font-size:16px;font-weight:700;line-height:1.55}
.lesson-board-panel .capture-shelf{width:min(340px,36vw);margin:5px auto 0}
.lesson-copy-panel{display:grid;gap:12px;min-height:0;align-content:start;padding-top:38px}
.lesson-piece-brief{display:grid;grid-template-columns:82px minmax(0,1fr);gap:14px;align-items:start;min-width:0}
.lesson-piece-brief .char-art{width:78px;height:78px}
.lesson-piece-brief.enemy-brief .char-art{opacity:.96;filter:drop-shadow(0 2px 2px rgba(142,59,49,.18))}
.lesson-copy-content{min-width:0}
.lesson-piece-brief .speech{margin-top:15px;border:0;border-radius:0;background:rgba(31,51,72,.045);padding:13px 15px;font-size:14px;line-height:1.7;min-height:78px}
.lesson-piece-brief.enemy-brief .speech{background:rgba(142,59,49,.055);color:#5b403b}
.lesson-copy-content .lesson-note{margin:0;text-align:left;font-size:12.5px}
.lesson-copy-panel .legend{justify-content:flex-start;margin:2px 0 0}
.lesson-nav{width:100%;justify-content:center;gap:18px;margin-top:30px;padding-top:0}
.lesson-nav .dots{margin:0;align-self:flex-end}
.lesson-nav .btn-prev,.lesson-nav .btn-next{border-radius:0;box-shadow:none;background:transparent;padding:7px 0;font-size:14px}
.lesson-nav .btn-prev{color:#7a8087;text-decoration:none}
.lesson-nav .btn-next{color:var(--meok);border-bottom:2px solid var(--easyblue)}
.lesson-nav .btn-next:disabled{background:transparent;box-shadow:none;color:#9ca4ad;border-bottom-color:#cbd4dc}
.lesson-nav .next-wrap{position:static;display:inline-flex;flex-direction:column;align-items:center;gap:7px;width:min(190px,calc(100vw - 48px));max-width:190px}
.lesson-nav.has-cd{padding-top:0}
.lesson-nav .cd-bubble{position:relative;transform:none;white-space:normal;width:min(190px,100%);padding:6px 10px;border-radius:10px;text-align:center;line-height:1.35;box-shadow:none}
.lesson-nav .cd-bubble::after{content:"";display:block;position:absolute;top:100%;right:22px;left:auto;transform:none;border:7px solid transparent;border-top-color:var(--meok)}

.board-wrap{margin:10px auto 4px;position:relative}
.board{
  display:grid;grid-template-columns:repeat(5,1fr);
  width:min(290px,74vw);aspect-ratio:1;
  border:3px solid var(--meok);border-radius:12px;overflow:hidden;touch-action:manipulation;
}
.sq{position:relative}
.sq.light{background:#FBF4E4}
.sq.dark{background:#CFE0CB}
.sq.hint{cursor:pointer}
.sq.hint::after{
  content:"";position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;
  background:var(--easyblue);opacity:.85;animation:pulse 1.2s ease-in-out infinite;
}
.sq.hint.capture-target::after{
  left:21%;top:21%;width:58%;height:58%;
  background:rgba(97,151,208,.28);border:3px solid var(--easyblue);
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.sq.wrong{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.path-layer{position:absolute;inset:0;z-index:4;pointer-events:none;transition:opacity .35s}
.path-layer.fade{opacity:0}
.path-layer .leg{fill:none;stroke:var(--easyblue);stroke-width:.09;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:.26 .2;opacity:.95}
.path-layer .elbow{fill:var(--easyblue);opacity:.9}
.path-layer .step-no{font-family:var(--font-korean);font-size:.42px;fill:#fff}
.path-layer .step-bg{fill:var(--meok);opacity:.92}
.piece-token{
  position:absolute;width:20%;aspect-ratio:1;pointer-events:none;z-index:5;
  transition:left .45s cubic-bezier(.34,1.4,.64,1), top .45s cubic-bezier(.34,1.4,.64,1);
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.28));
}
.piece-token::before{
  content:"";position:absolute;left:15%;right:15%;bottom:1%;height:16%;border-radius:50%;z-index:-1;
  background:radial-gradient(ellipse at center, rgba(62,92,148,.5) 0%, rgba(62,92,148,.24) 55%, rgba(62,92,148,0) 75%);
  box-shadow:inset 0 0 0 2px rgba(62,92,148,.4);
}
.enemy-token::before{
  background:radial-gradient(ellipse at center, rgba(142,59,49,.5) 0%, rgba(142,59,49,.24) 55%, rgba(142,59,49,0) 75%);
  box-shadow:inset 0 0 0 2px rgba(142,59,49,.45);
}
.mission{text-align:center;font-family:var(--font-korean);font-size:15.5px;color:var(--noerok);margin-top:10px;min-height:24px}
.mission.done{color:var(--jinsa)}
.star-burst{position:absolute;font-size:26px;pointer-events:none;z-index:9;animation:burst .8s ease-out forwards}
@keyframes burst{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.8) translateY(-30px);opacity:0}}
.enemy-token.poof{animation:poof .42s ease-out forwards}
@keyframes poof{0%{transform:scale(1);opacity:1}55%{transform:scale(1.35) rotate(8deg);opacity:.72}100%{transform:scale(.15) translateY(-24px);opacity:0}}
.checkmate-label{position:absolute;left:50%;top:-18px;transform:translateX(-50%);white-space:nowrap;padding:3px 6px;border-radius:7px;background:var(--jinsa);color:#fff;font-family:var(--font-korean);font-size:11px;line-height:1;box-shadow:0 2px 0 #7e3229;z-index:8}
.capture-shelf{display:flex;justify-content:flex-end;gap:3px;min-height:0;margin:4px auto 0;width:min(290px,74vw);padding:0;color:var(--mongol);align-items:center}
.capture-shelf .captured-piece{width:26px;height:26px;animation:collect .55s cubic-bezier(.18,1.55,.5,1) both}
@keyframes collect{from{transform:translate(-70px,-80px) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.scene.story-intro .char-row{width:min(560px,100%);align-self:center;align-items:center;margin:auto;max-width:100%;transform:translateY(38px);transition:transform .38s ease}
.scene.story-intro .enemy-row,.scene.story-intro .board-wrap,.scene.story-intro .capture-shelf,.scene.story-intro .mission,.scene.story-intro .lesson-note,.scene.story-intro .legend,.scene.story-intro .nav{display:none}
.scene.story-intro .char-text{padding:0;text-align:center}
.scene.story-intro .speech{min-height:96px;display:flex;align-items:center;justify-content:center;text-align:center}
.scene.story-ready .char-row{animation:story-settle .42s ease both}
@keyframes story-settle{from{transform:translateY(26px);opacity:.72}to{transform:none;opacity:1}}
.lesson-note{font-size:13px;line-height:1.55;text-align:center;color:#4a5568;margin-top:4px}
.rule-list{display:flex;flex-direction:column;gap:10px;margin:16px 0 6px}
.rule-item{display:flex;gap:12px;align-items:flex-start;background:#FFFCF3;border:2.5px solid var(--meok);
  border-radius:16px;padding:13px 15px;box-shadow:0 4px 0 rgba(31,51,72,.14)}
.rule-item .ri-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--meok);color:#fff;
  font-family:var(--font-korean);font-size:14px;display:grid;place-items:center}
.rule-item .ri-body{font-size:13.5px;line-height:1.55;color:#4a5568}
.rule-item .ri-body .ri-t{font-family:var(--font-korean);color:var(--meok);display:block;font-size:15px;margin-bottom:3px}
.rule-item .ri-body .ri-t em{font-style:normal;color:var(--jinsa)}
.rule-item .ri-body b{color:var(--jinsa)}
.goal-art{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:4px 0 2px}
.goal-art>div{width:74px;height:74px}
.goal-art .vs{font-family:var(--font-korean);font-size:14px;color:var(--jinsa);align-self:center}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.cmp{border-radius:16px;padding:13px;border:2.5px solid;font-size:12.5px;line-height:1.5}
.cmp .cmp-t{font-family:var(--font-korean);font-size:15px;margin-bottom:4px;display:block}
.cmp.esc{border-color:var(--noerok);color:#31584f;background:rgba(47,107,98,.07)}
.cmp.esc .cmp-t{color:var(--noerok)}
.cmp.mate{border-color:var(--jinsa);color:#7e3229;background:rgba(180,72,60,.08)}
.cmp.mate .cmp-t{color:var(--jinsa)}
.sq.sq-guard::before{content:"";position:absolute;inset:3px;border:4px solid var(--goryeo);pointer-events:none}
.sq.sq-danger.strong::before{inset:3px;border:4px solid var(--jinsa);background:transparent}
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:11.5px;color:#4a5568;margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;background:transparent}
.legend i.dgr{border:3px solid var(--jinsa)}
.legend i.grd{border:3px solid var(--goryeo)}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px}
.nav button{font-family:var(--font-korean);font-size:17px;border:none;border-radius:999px;padding:11px 26px;cursor:pointer;transition:transform .1s}
.nav button:active{transform:scale(.95)}
.btn-next{background:var(--meok);color:#fff;box-shadow:0 4px 0 #0e1c2c}
.btn-next:disabled{background:#b9c0cc;box-shadow:0 4px 0 #99a1ad;cursor:not-allowed;opacity:.5}
.next-wrap{position:relative;display:inline-block}
.nav.has-cd{padding-top:34px}
.cd-bubble{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#FFFCF3;border:2.5px solid var(--meok);border-radius:999px;padding:3px 11px;white-space:nowrap;
  font-family:var(--font-korean);font-size:12.5px;color:var(--meok);box-shadow:0 3px 0 rgba(31,51,72,.15)}
.cd-bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--meok)}
.cd-bubble b{color:var(--jinsa);font-weight:400}
.nav.lesson-nav{display:flex;justify-content:center;align-items:flex-end;gap:18px;flex-wrap:wrap;width:100%;margin-top:30px;padding-top:0}
.nav.lesson-nav .dots{margin:0;align-self:flex-end}
.nav.lesson-nav .next-wrap{position:static;display:inline-flex;flex-direction:column;align-items:center;gap:7px;width:min(190px,calc(100vw - 48px));max-width:190px}
.nav.lesson-nav .cd-bubble{position:relative;box-sizing:border-box;transform:none;white-space:normal;overflow-wrap:anywhere;width:100%;max-width:190px;padding:6px 10px;border-radius:10px;text-align:center;line-height:1.35;box-shadow:none}
.nav.lesson-nav .cd-bubble::after{content:"";display:block;position:absolute;top:100%;right:22px;left:auto;transform:none;border:7px solid transparent;border-top-color:var(--meok)}
.nav.lesson-nav.has-cd{padding-top:0}
.quiz-flag{display:inline-block;font-family:var(--font-korean);font-size:12px;background:var(--jinsa);color:#fff;
  border-radius:999px;padding:3px 11px;margin-bottom:6px}
.mission.quiz{color:var(--jinsa)}
.btn-prev{background:transparent;color:var(--meok);text-decoration:underline;padding:11px 10px}
.dots{display:flex;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#dbcfb3}
.dot.on{background:var(--geum)}

.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 2px}
.badge{background:#fff;border:2.5px solid var(--meok);border-radius:16px;padding:8px 4px 6px;text-align:center}
.badge .art{width:100%;height:66px}
.badge p{font-family:var(--font-korean);font-size:13px;margin-top:2px}
.badge.locked{opacity:.32;filter:grayscale(1)}
.badge.earned{animation:pop .5s cubic-bezier(.34,1.6,.64,1)}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
.final-msg{text-align:center;font-size:15px;line-height:1.7;margin-top:4px}
.replay{margin:12px auto 0;display:block;font-family:var(--font-korean);font-size:17px;background:var(--easyblue);color:#fff;border:none;border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 4px 0 #3f6f9f}
.replay:active{transform:translateY(3px);box-shadow:0 1px 0 #3f6f9f}

.sq.sq-danger::before{content:"";position:absolute;inset:0;background:rgba(180,72,60,.15);pointer-events:none}
.king-danger::before{content:"";position:absolute;inset:-12%;border-radius:50%;box-shadow:0 0 0 3px rgba(180,72,60,.6);animation:dangerPulse 1s ease-in-out infinite}
@keyframes dangerPulse{0%,100%{box-shadow:0 0 0 3px rgba(180,72,60,.6)}50%{box-shadow:0 0 0 9px rgba(180,72,60,.12)}}

button:focus-visible{outline:3px solid var(--geum);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:720px){
  .lesson-layout{grid-template-columns:1fr;gap:22px}
  .lesson-board-panel .board,.lesson-board-panel .mission,.lesson-board-panel .capture-shelf,.lesson-board-label{width:min(340px,82vw)}
  .lesson-copy-panel{min-height:0}
  .lesson-piece-brief{grid-template-columns:66px minmax(0,1fr);gap:11px}
  .lesson-piece-brief .char-art{width:62px;height:62px}
}
@media (max-width:560px){.scene.story-intro .char-row{transform:translateY(24px)}.scene.story-intro .char-art{width:88px;height:88px}.lesson-copy-content .char-name{font-size:22px}.lesson-nav{margin-top:8px}}
h1,h2,h3,h4,.jua{font-weight:700}

/* Hallmark redesign: focused learning split-plane, original piece assets retained. */
:root{--font-korean:var(--font-ui)}
html,body{overflow-x:clip}
body,#app{background:#fffdf7;font-family:var(--font-ui)}
.scene.active{animation:none}
.scene{padding:clamp(18px,3vw,34px) clamp(18px,4vw,48px)}
h1,h2,h3,h4,.jua,.title-label,.warrior-label,.lesson-board-label,.mission,.lesson-note,.speech,.nav button,.badge p{font-family:var(--font-ui);font-style:normal}
.eyebrow,.warrior-label,.quiz-flag{border-radius:0;background:transparent;color:var(--goryeo);padding:0;font-weight:850}
.start-btn,.replay,.nav button,.btn-next{border:1px solid var(--meok);border-radius:0;box-shadow:none;background:transparent;color:var(--meok)}
.start-btn:hover,.replay:hover,.nav button:hover,.btn-next:hover{background:var(--meok);color:#fffdf7;transform:none}
.start-btn:active,.replay:active,.nav button:active{transform:none;box-shadow:none}
.lesson-layout{width:min(1040px,100%);grid-template-columns:minmax(250px,360px) minmax(0,1fr);gap:clamp(28px,5vw,72px)}
.lesson-board-panel{padding-top:10px}
.lesson-board-label{width:min(360px,100%);margin-bottom:12px;font-size:18px;font-weight:850}
.lesson-board-panel .board,.lesson-board-panel .mission,.lesson-board-panel .capture-shelf{width:min(360px,100%)}
.board{border-radius:0;border-width:2px}
.lesson-board-panel .mission{margin-top:14px;font-size:17px;font-weight:750}
.lesson-copy-panel{align-content:center;gap:16px;padding-top:40px;min-height:430px}
.lesson-piece-brief{grid-template-columns:88px minmax(0,1fr);gap:18px;align-items:center}
.lesson-piece-brief .char-art{width:84px;height:84px}
.lesson-piece-brief .speech{margin:0;min-height:0;border:0;border-left:2px solid var(--goryeo);border-radius:0;background:#f6f4ef;padding:16px 18px;font-size:15px;line-height:1.75}
.lesson-piece-brief.enemy-brief .speech{border-left-color:var(--mongol);background:rgba(142,59,49,.045)}
.lesson-piece-brief.enemy-brief .speech,.lesson-piece-brief .speech{animation:none}
.lesson-piece-brief .speech.typewriter-pending{visibility:hidden}
.lesson-piece-brief .speech.typewriter-active::after{
  content:"";
  display:inline-block!important;
  width:2px;
  height:1.05em;
  margin-left:3px;
  vertical-align:-.12em;
  background:currentColor;
  animation:typewriter-cursor .72s steps(1,end) infinite;

const SFX = {
  ctx:null, muted:false,
  ac(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  env(g,t0,a,d,peak){ g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(peak,t0+a); g.gain.exponentialRampToValueAtTime(0.001,t0+a+d); },
  tone(freq,dur,type,peak,slideTo,when){
    if(this.muted) return;
    try{
      const ctx=this.ac(), t0=ctx.currentTime+(when||0);
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
      this.env(g,t0,.008,dur,peak||.15);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0+dur+.05);
    }catch(e){}
  },
  noise(dur,peak){
    if(this.muted) return;
    try{
      const ctx=this.ac(), t0=ctx.currentTime;
      const buf=ctx.createBuffer(1,Math.max(1,Math.floor(ctx.sampleRate*dur)),ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
      const src=ctx.createBufferSource(); src.buffer=buf;
      const g=ctx.createGain(); this.env(g,t0,.004,dur,peak||.2);
      const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900;
      src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(t0);
    }catch(e){}
  },
  move(){ this.tone(520,.07,'square',.09,240); },
  capture(){ this.noise(.13,.22); this.tone(300,.12,'square',.10,110); },
  wrong(){ this.tone(170,.22,'sawtooth',.11,120); },
  good(){ this.tone(523,.09,'triangle',.13); this.tone(659,.09,'triangle',.13,null,.09); }
};

const rays = (dirs)=>{
  const out=[];
  for(const [dr,dc] of dirs){
    let r=2+dr,c=2+dc;
    while(r>=0&&r<5&&c>=0&&c<5){out.push([r,c]);r+=dr;c+=dc;}
  }
  return out;
};
const inB5=([r,c])=>r>=0&&r<5&&c>=0&&c<5;
const rayFrom=([r,c],dirs)=>{
  const out=[];
  for(const [dr,dc] of dirs){
    let rr=r+dr, cc=c+dc;
    while(inB5([rr,cc])){ out.push([rr,cc]); rr+=dr; cc+=dc; }
  }
  return out;
};

const totalPieceScenes = PIECES.length;

const RECAP_SCENE = CHECKMATE_START_SCENE + CHECKMATE_LESSONS.length;
const MODULE_DONE_SCENE = -1;
const REVIEW_SCENE = -2;
const requestedModule = Number(new URLSearchParams(window.location.search).get('module')) || 1;
const moduleId = Math.min(4, Math.max(1, requestedModule));
const isReview = new URLSearchParams(window.location.search).get('review') === '1';
const moduleBounds = {
  1: [0, PIECE_START_SCENE + totalPieceScenes - 1],
  2: [CAPTURE_START_SCENE, CAPTURE_START_SCENE + CAPTURE_SCENES.length - 1],
  3: [CHECK_START_SCENE, CHECKMATE_START_SCENE - 1],
  4: [CHECKMATE_START_SCENE, RECAP_SCENE],
};
const [MODULE_START_SCENE, MODULE_END_SCENE] = moduleBounds[moduleId];

const state = {scene:isReview ? REVIEW_SCENE : MODULE_START_SCENE, earned:{}, captures:{}, checks:{}, checkmates:{}, reviewIndex:0, reviewScore:0};
let countdownTimer=null;
let reviewQuizReported=false;
let moduleCompletionReported=false;
const root = document.getElementById('scenes');

function progressCount(total, idx){
  const current=Math.min(total,Math.max(1,Number(idx)+1));
  return `<span class="step-counter" aria-label="${total}단계 중 ${current}단계">${current} / ${total}</span>`;
}
function moduleProgressCount(scene){
  return progressCount(MODULE_END_SCENE-MODULE_START_SCENE+1,scene-MODULE_START_SCENE);
}

function render(){
  cancelSceneTypewriters();
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; }
  const s = state.scene;
  let html='';
  if(s===REVIEW_SCENE) html = reviewScene();
  else if(s===MODULE_DONE_SCENE) html = moduleDoneScene();
  else if(s===0) html = titleScene();
  else if(s===GOAL_SCENE) html = goalScene();
  else if(s>=PIECE_START_SCENE && s<PIECE_START_SCENE+totalPieceScenes)
    html = pieceScene(PIECES[s-PIECE_START_SCENE], s-PIECE_START_SCENE);
  else if(s>=CAPTURE_START_SCENE && s<CAPTURE_START_SCENE+CAPTURE_SCENES.length) html = captureScene(CAPTURE_SCENES[s-CAPTURE_START_SCENE], s-CAPTURE_START_SCENE);
  else if(s>=CHECK_START_SCENE && s<CHECKMATE_START_SCENE) html = checkScene(CHECK_LESSONS[s-CHECK_START_SCENE], s-CHECK_START_SCENE);
  else if(s>=CHECKMATE_START_SCENE && s<RECAP_SCENE) html = checkmateScene(CHECKMATE_LESSONS[s-CHECKMATE_START_SCENE], s-CHECKMATE_START_SCENE);
  else if(s===RECAP_SCENE) html = recapScene();
  else html = moduleDoneScene();
  root.innerHTML = `<div class="scene active">${html}</div>`;
  bindScene();
  beginStoryIntro();
  runSceneTypewriters();
}

function beginStoryIntro(){
  const scene=root.querySelector('.scene');
  const board=scene?.querySelector('.board-wrap');
  if(!scene||!board||isReview) return;
  requestAnimationFrame(()=>scene.classList.add('story-ready'));
}

let sceneTypewriterRun=0;
const reduceTutorialMotion=window.matchMedia('(prefers-reduced-motion: reduce)');

function cancelSceneTypewriters(){
  sceneTypewriterRun+=1;
}

function cloneTypewriterContent(source,target,segments){
  source.childNodes.forEach((child)=>{
    if(child.nodeType===Node.TEXT_NODE){
      const node=document.createTextNode('');
      target.appendChild(node);
      segments.push({node,characters:Array.from(child.nodeValue||'')});
      return;
    }
    if(child.nodeType===Node.ELEMENT_NODE){
      const clone=child.cloneNode(false);
      target.appendChild(clone);
      cloneTypewriterContent(child,clone,segments);
    }
  });
}

function typewriterDelay(character){
  if(/[.!?。！？]/.test(character)) return 105;
  if(/[,，;:]/.test(character)) return 55;
  if(/\s/.test(character)) return 8;
  return 19;
}

function typewriteSpeech(element,runId,onComplete){
  const source=element.cloneNode(true);
  const measuredHeight=Math.ceil(element.getBoundingClientRect().height);
  const segments=[];
  element.replaceChildren();
  element.style.minHeight=measuredHeight+'px';
  element.classList.remove('typewriter-pending');
  element.classList.add('typewriter-active');
  cloneTypewriterContent(source,element,segments);

  let segmentIndex=0;
  let characterIndex=0;
  const step=()=>{
    if(runId!==sceneTypewriterRun) return;
    while(segmentIndex<segments.length&&characterIndex>=segments[segmentIndex].characters.length){
      segmentIndex+=1;
      characterIndex=0;
    }
    if(segmentIndex>=segments.length){
      element.classList.remove('typewriter-active');
      onComplete?.();
      return;
    }
    const segment=segments[segmentIndex];
    const character=segment.characters[characterIndex++];
    segment.node.nodeValue+=character;
    window.setTimeout(step,typewriterDelay(character));
  };
  window.setTimeout(step,120);
}

function runSceneTypewriters(){
  if(reduceTutorialMotion.matches) return;
  const targets=Array.from(root.querySelectorAll('.lesson-copy-panel .speech'));
  if(!targets.length) return;
  targets.forEach((target)=>target.classList.add('typewriter-pending'));
  const runId=sceneTypewriterRun;
  const play=(index)=>{
    if(runId!==sceneTypewriterRun||index>=targets.length) return;
    typewriteSpeech(targets[index],runId,()=>window.setTimeout(()=>play(index+1),110));
  };
  play(0);
}
/* ---------- 보드 유틸 ---------- */
function makeGrid(board){
  board.innerHTML='';
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){
    const sq=document.createElement('div');
    sq.className='sq '+(((r+c)%2===0)?'light':'dark');
    sq.dataset.rc=r+','+c;
    board.appendChild(sq);
  }
}
function sqAt(board,r,c){ return board.querySelector(`.sq[data-rc="${r},${c}"]`); }
function placeToken(el,[r,c]){
  if(el.dataset.placed) SFX.move();
  el.style.left=(c*20)+'%'; el.style.top=(r*20)+'%';
  el.dataset.placed='1';
}
function addToken(board,art,at,extraClass=''){
  const token=document.createElement('div');
  token.className=('piece-token '+extraClass).trim();
  token.innerHTML=art;
  board.appendChild(token);
  placeToken(token,at);
  return token;
}
/* ---------- 나이트 L자 경로 시각화 ---------- */
function knightElbow([r0,c0],[r1,c1]){
  const dr=r1-r0, dc=c1-c0;
  return Math.abs(dr)===2 ? [r0+dr, c0] : [r0, c0+dc];   /* 곧게 두 칸 간 지점 */
}
function drawLPath(board, from, elbow, to){
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('class','path-layer');
  svg.setAttribute('viewBox','0 0 5 5');
  svg.setAttribute('preserveAspectRatio','none');
  const cx=([r,c])=>[c+0.5, r+0.5];
  const [x0,y0]=cx(from), [xe,ye]=cx(elbow), [x1,y1]=cx(to);
  const seg=(ax,ay,bx,by,delay)=>{
    const line=document.createElementNS(NS,'line');
    line.setAttribute('class','leg');
    line.setAttribute('x1',ax); line.setAttribute('y1',ay);
    line.setAttribute('x2',ax); line.setAttribute('y2',ay);
    svg.appendChild(line);
    setTimeout(()=>{
      line.style.transition='all .34s cubic-bezier(.4,0,.2,1)';
      line.setAttribute('x2',bx); line.setAttribute('y2',by);
    },delay);
    return line;
  };
  const badge=(bx,by,label,delay)=>{
    const g=document.createElementNS(NS,'g');
    g.setAttribute('opacity','0');
    const circ=document.createElementNS(NS,'circle');
    circ.setAttribute('class','step-bg'); circ.setAttribute('cx',bx); circ.setAttribute('cy',by); circ.setAttribute('r','.3');
    const t=document.createElementNS(NS,'text');
    t.setAttribute('class','step-no'); t.setAttribute('x',bx); t.setAttribute('y',by+0.15);
    t.setAttribute('text-anchor','middle'); t.textContent=label;
    g.appendChild(circ); g.appendChild(t); svg.appendChild(g);
    setTimeout(()=>{ g.style.transition='opacity .25s'; g.setAttribute('opacity','1'); },delay);
  };
  seg(x0,y0,xe,ye,20);            /* ① 곧게 두 칸 */
  badge((x0+xe)/2,(y0+ye)/2,'1',80);
  seg(xe,ye,x1,y1,420);           /* ② 옆으로 한 칸 */
  const perp = Math.abs(x1-xe)>Math.abs(y1-ye) ? [0,-0.3] : [-0.3,0];
  badge((xe+x1)/2+perp[0], (ye+y1)/2+perp[1], '2', 480);
  const dot=document.createElementNS(NS,'circle');
  dot.setAttribute('class','elbow'); dot.setAttribute('cx',xe); dot.setAttribute('cy',ye); dot.setAttribute('r','.1');
  svg.appendChild(dot);
  board.appendChild(svg);
  return svg;
}
/* 나이트: 곧게 두 칸 → 옆으로 한 칸, 경로를 그리며 두 번에 나눠 이동 */
function animateKnight(board, token, from, to, msgEl, onDone){
  const elbow=knightElbow(from,to);
  const layer=drawLPath(board, from, elbow, to);
  const say=(t)=>{ if(msgEl){ msgEl.classList.remove('quiz'); msgEl.innerHTML=t; } };
  say(choose('① <b>곧게 두 칸</b>, ② <b>옆으로 한 칸</b>. 경로를 먼저 확인해요.','① <b>Two squares straight</b>, ② <b>one square sideways</b>. Read the path first.'));
  setTimeout(()=>{ placeToken(token,elbow); },650);
  setTimeout(()=>{ say(choose('표시한 1, 2 순서대로 움직이면 <b>L자 점프</b>예요.','Follow steps 1 and 2 to make the <b>L-shaped jump</b>.')); },980);
  setTimeout(()=>{ placeToken(token,to); },1120);
  setTimeout(()=>{
    layer.classList.add('fade');
    setTimeout(()=>layer.remove(),400);
    if(onDone) onDone();
  },1580);
}
function celebrate(sq){
  SFX.good();
  const board=document.getElementById('board');
  const rect=sq.getBoundingClientRect(), brect=board.getBoundingClientRect();
  for(let i=0;i<3;i++){
    const s=document.createElement('div');
    s.className='star-burst'; s.textContent=['⭐','✨','🌟'][i];
    s.style.left=(rect.left-brect.left+rect.width/2-13+(i-1)*18)+'px';
    s.style.top=(rect.top-brect.top+rect.height/2-13)+'px';
    board.appendChild(s);
    setTimeout(()=>s.remove(),820);
  }
}
function flashWrong(sq,message){
  SFX.wrong();
  const m=document.getElementById('mission');
  sq.classList.remove('wrong'); void sq.offsetWidth; sq.classList.add('wrong');
  m.textContent=message;
}

/* ---------- 기물 소개 씬 ---------- */
function setupBoard(p, goNext){
  const board=document.getElementById('board');
  makeGrid(board);
  const mission=document.getElementById('mission');
  const nextBtn=document.getElementById('nextBtn');
  const bubble=document.getElementById('cdBubble');
  let pos=p.start.slice();
  const token=addToken(board,ART[p.id],pos);
  let mode='explore', moves=0, finished=false, animating=false;
  const isKnight = p.id==='g_knight';

  const legal=()=>MOVE_GEN[p.id](pos);
  function clearHints(){ board.querySelectorAll('.sq.hint').forEach(el=>el.classList.remove('hint')); }
  function showHints(){
    clearHints();
    legal().forEach(([r,c])=>{ const sq=sqAt(board,r,c); if(sq) sq.classList.add('hint'); });
  }
  showHints();

  /* 갈 곳이 없어졌을 때(창병이 끝줄 도달) 출발 자리로 되돌리기 */
  function backToStart(){
    pos=p.start.slice();
    placeToken(token,pos);
    showHints();
  }

  /* ── 이미 배지를 받은 용사면 바로 통과 ── */
  if(state.earned[p.id]){
    nextBtn.disabled=false; nextBtn.textContent=choose('다음 →','Next →');
    nextBtn.onclick=()=>goNext();
  }else{
    /* ── 5초 카운트다운 ── */
    let left=5;
    nextBtn.disabled=true;
    bubble.style.display='';
    const navEl=bubble.closest('.nav'); if(navEl) navEl.classList.add('has-cd');
    bubble.innerHTML=isEnglish?'<b>'+left+'s</b> until the quick check':'<b>'+left+'초</b> 뒤에 확인 문제!';
    countdownTimer=setInterval(()=>{
      left--;
      if(left>0){ bubble.innerHTML=isEnglish?'<b>'+left+'s</b> until the quick check':'<b>'+left+'초</b> 뒤에 확인 문제!'; return; }
      clearInterval(countdownTimer); countdownTimer=null;
      bubble.innerHTML=choose('이제 확인 문제를 풀어볼까?','Ready for the quick check?');
      nextBtn.disabled=false;
      SFX.good();
    },1000);
    nextBtn.onclick=()=>startQuiz();
  }

  function startQuiz(){
    mode='quiz';
    const navEl=bubble.closest('.nav'); if(navEl) navEl.classList.remove('has-cd');
    let moved=false;
    if(legal().length===0){ backToStart(); moved=true; }   /* 갈 곳이 없으면 출발 자리에서 출제 */
    clearHints();
    bubble.style.display='none';
    nextBtn.disabled=true; nextBtn.textContent=choose('다음 →','Next →');
    mission.classList.remove('done'); mission.classList.add('quiz');
    mission.innerHTML='<span class="quiz-flag">'+choose('확인 문제','Quick check')+'</span><br>'
      +(moved?choose('출발 자리로 돌아왔어! ','Back at the starting square. '):'')
      +choose('파란 점 없이! 지금 자리에서 ','Without blue dots, choose a legal square for ')+'<b>'+p.name+'</b>'+choose(koreanSubjectParticle(p.name)+' 갈 수 있는 칸을 하나 눌러봐.','.');
  }

  board.addEventListener('click', e=>{
    const sq=e.target.closest('.sq'); if(!sq||finished||animating) return;
    const [r,c]=sq.dataset.rc.split(',').map(Number);
    const ok=legal().some(([rr,cc])=>rr===r&&cc===c);

    if(mode==='explore'){
      if(!ok){ flashWrong(sq,choose('음, 거긴 갈 수 없어. 파란 점을 찾아봐!','That square is not legal. Choose a blue dot.')); return; }
      const from=pos.slice();
      pos=[r,c]; moves++;
      if(isKnight){
        animating=true;
        clearHints();
        animateKnight(board, token, from, pos, mission, ()=>{
          animating=false;
          showHints();
          mission.classList.remove('quiz');
          mission.textContent = isEnglish
            ? (moves===1?'L-shaped jump complete. The available landing squares changed.':moves<4?'Good. Keep following the blue dots.':'You mastered the knight’s L-shaped jump.')
            : (moves===1?'L자 점프 성공! 자리를 옮기니 뛸 수 있는 칸도 달라졌지?':moves<4?'좋아! 파란 점을 따라 마음껏 뛰어보자.':'백마 기수의 L자 점프를 완전히 익혔구나!');
        });
        return;
      }
      placeToken(token,pos);
      showHints();
      mission.classList.remove('quiz');

      /* 창병이 끝줄에 닿으면 출발 자리로 돌려보내 연습을 이어갑니다. */
      if(legal().length===0){
        mission.innerHTML=choose('끝줄에 닿았어! 창병은 앞으로만 걸으니 여기선 더 갈 곳이 없어. 다시 출발 자리에서 연습해볼까?','The pawn reached the last rank and cannot move farther here. Return to the start and practice again.');
        setTimeout(()=>{ if(!finished) backToStart(); },1800);
        return;
      }

      mission.textContent = isEnglish
        ? (moves===1?'Good. Moving changes the available squares. Keep going.':moves<4?'Follow the blue dots and keep practicing.':'You mastered '+p.name+'.')
        : (moves===1?'잘했어! 자리를 옮기니 갈 수 있는 칸도 달라졌지? 계속 움직여봐.':moves<4?'좋아! 파란 점을 따라 마음껏 연습해보자.':p.name+'의 움직임을 완전히 익혔구나!');
      return;
    }

    /* 확인 문제 */
    if(ok){
      finished=true;
      const from=pos.slice();
      pos=[r,c];
      const finish=()=>{
        celebrate(sq);
        state.earned[p.id]=true;
        mission.classList.remove('quiz'); mission.classList.add('done');
        mission.textContent=choose('정답! '+p.name+' 배지를 받았어요! 🎖️','Correct. You mastered '+p.name+'.');
        nextBtn.disabled=false;
        nextBtn.onclick=()=>goNext();
      };
      if(isKnight){ animateKnight(board, token, from, pos, mission, finish); }
      else { placeToken(token,pos); finish(); }
    }else{
      flashWrong(sq,choose('다시 시도해보자! '+QUIZ_HINT[p.id],'Try again and recall this piece’s movement.'));
    }
  });
}

function setupCapture(c){
  const board=document.getElementById('board');
  makeGrid(board);
  const token=addToken(board,ART[c.piece],c.start);
  const targets=(c.targets || [{at:c.target,enemy:c.enemy}]).map((entry)=>({
    at:entry.at.slice(), enemy:entry.enemy, token:addToken(board,ART[entry.enemy],entry.at,'enemy-token'), done:false,
  }));
  targets.forEach((entry)=>sqAt(board,entry.at[0],entry.at[1]).classList.add('hint','capture-target'));
  let blockedEnemy=null;
  let blockedTried=!c.blockedTarget;
  if(c.blockedTarget){
    blockedEnemy=addToken(board,ART.m_knight,c.blockedTarget,'enemy-token');
    addToken(board,ART.m_rook,[0,c.blockedTarget[1]],'enemy-token guard-token');
    sqAt(board,c.blockedTarget[0],c.blockedTarget[1]).classList.add('sq-danger','strong');
  }
  let done=false;
  board.addEventListener('click', e=>{
    const sq=e.target.closest('.sq'); if(!sq||done) return;
    const m=document.getElementById('mission');
    if(c.blockedTarget && sq===sqAt(board,c.blockedTarget[0],c.blockedTarget[1])){
      blockedTried=true;
      m.textContent=choose('그 칸은 몽골 공성탑이 지키고 있어 임금님이 움직일 수 없어요. 이제 안전한 칸을 골라 보세요.','The Mongol siege tower attacks that square, so the king cannot move there. Now choose the safe square.');
      sq.classList.add('wrong');
      SFX.wrong();
      return;
    }
    const entry=targets.find((candidate)=>!candidate.done && sq===sqAt(board,candidate.at[0],candidate.at[1]));
    if(entry){
      if(!blockedTried){ flashWrong(sq,choose('두 카드를 비교하려면 먼저 공격받는 칸을 눌러 보세요.','Check the attacked square first.')); return; }
      entry.done=true;
      sq.classList.remove('hint','capture-target');
      const finish=()=>{
        entry.token.classList.add('poof'); SFX.capture();
        const shelf=document.getElementById('captureShelf');
        if(shelf){ const collected=document.createElement('div'); collected.className='captured-piece'; collected.innerHTML=ART[entry.enemy]; shelf.appendChild(collected); }
        setTimeout(()=>entry.token.remove(),400);
        celebrate(sq);
        if(targets.every((candidate)=>candidate.done)){
          done=true;
          m.classList.remove('quiz');
          m.textContent=choose('몽골군을 잡았다! 고려군 만세!','Captured. Goryeo holds the line.');
          m.classList.add('done');
          state.captures[c.id]=true;
          document.getElementById('nextBtn').disabled=false;
        }else{
          m.textContent=choose('직선 잡기 성공! 출발점으로 돌아가 대각선 잡기도 해 보세요.','Straight-line capture complete. Return to the start and try the diagonal capture.');
          setTimeout(()=>placeToken(token,c.start),260);
        }
      };
      if(c.piece==='g_knight'){
        animateKnight(board, token, c.start, entry.at, m, finish);
      }else{
        placeToken(token,entry.at);
        finish();
      }
    }else{
      flashWrong(sq,choose('앗! 적이 있는 칸을 눌러야 잡을 수 있어!','Choose a square occupied by an enemy piece.'));
    }
  });
}

/* ---------- 체크 대응 씬 ---------- */
function setupCheck(lesson){
  const board=document.getElementById('board');
  makeGrid(board);
  const complete=(sq,message)=>{
    celebrate(sq);
    const mission=document.getElementById('mission');
    mission.textContent=message;
    mission.classList.add('done');
    state.checks[lesson.id]=true;
    document.getElementById('nextBtn').disabled=false;
  };
  if(lesson.id==='block'){
    addToken(board,ART.m_rook,[0,2],'enemy-token');
    addToken(board,ART.g_king,[3,2],'king-danger');
    const bishop=addToken(board,ART.g_bishop,[4,0]);
    const target=sqAt(board,2,2); target.classList.add('hint');
    board.addEventListener('click',event=>{
      const sq=event.target.closest('.sq'); if(!sq) return;
      if(sq===target){ placeToken(bishop,[2,2]); target.classList.remove('hint'); complete(sq,choose('지혜 승병이 길을 막았어요! 체크에서 벗어났습니다.','The bishop blocked the line. The king is out of check.')); }
      else flashWrong(sq,choose('공성탑과 임금님 사이의 파란 점에 용사를 세워 보세요.','Place the bishop on the blue square between the siege tower and king.'));
    });
    return;
  }
  if(lesson.id==='capture'){
    const enemy=addToken(board,ART.m_rook,[2,2],'enemy-token');
    addToken(board,ART.g_king,[3,2],'king-danger');
    const knight=addToken(board,ART.g_knight,[4,1]);
    const target=sqAt(board,2,2); target.classList.add('hint');
    board.addEventListener('click',event=>{
      const sq=event.target.closest('.sq'); if(!sq) return;
      if(sq===target){
        target.classList.remove('hint');
        animateKnight(board,knight,[4,1],[2,2],document.getElementById('mission'),()=>{
          enemy.classList.add('poof');
          const shelf=document.getElementById('captureShelf');
          if(shelf){ const collected=document.createElement('div'); collected.className='captured-piece'; collected.innerHTML=ART.m_rook; shelf.appendChild(collected); }
          setTimeout(()=>enemy.remove(),360);
          complete(sq,choose('공성탑을 잡았어요! 체크에서 벗어났습니다.','The siege tower is captured. The king is out of check.'));
        });
      }
      else flashWrong(sq,choose('공격하고 있는 몽골 공성탑을 잡아 보세요.','Capture the attacking Mongol siege tower.'));
    });
    return;
  }
  const dangerCol=2;
  board.querySelectorAll('.sq').forEach(sq=>{
    const [,c]=sq.dataset.rc.split(',').map(Number);
    if(c===dangerCol) sq.classList.add('sq-danger');
  });
  addToken(board,ART.m_rook,[0,2],'enemy-token');
  const kingStart=[3,2];
  const king=addToken(board,ART.g_king,kingStart,'king-danger');
  const safeMoves=MOVE_GEN.g_king(kingStart).filter(([,c])=>c!==dangerCol);
  safeMoves.forEach(([r,c])=>sqAt(board,r,c).classList.add('hint'));
  board.addEventListener('click',event=>{
    const sq=event.target.closest('.sq'); if(!sq) return;
    const [r,c]=sq.dataset.rc.split(',').map(Number);
    if(sq.classList.contains('hint')){
      placeToken(king,[r,c]); king.classList.remove('king-danger');
      board.querySelectorAll('.sq.hint').forEach(el=>el.classList.remove('hint'));
      complete(sq,choose('임금님이 안전한 곳으로 피신했어요!','The king escaped to safety.'));
    }else flashWrong(sq,c===dangerCol?choose('안돼! 그 줄은 아직 위험해!','That file is still under attack.'):choose('파란 점을 찾아보세요.','Choose a blue dot.'));
  });
}

/* ---------- 체크메이트 씬 ---------- */
function setupCheckmate(lesson){
  const board=document.getElementById('board');
  makeGrid(board);
  const mission=document.getElementById('mission');
  const note=document.getElementById('mateNote');
  const addLabel=(token)=>{
    const label=document.createElement('span');
    label.className='checkmate-label';
    label.textContent=choose('체크메이트','Checkmate');
    token.appendChild(label);
  };
  const mark=(guards,dangers)=>{
    guards.forEach(([r,c])=>sqAt(board,r,c)?.classList.add('sq-guard'));
    dangers.forEach(([r,c])=>sqAt(board,r,c)?.classList.add('sq-danger','strong'));
  };

  if(lesson.id==='defended'){
    const enemyKing=addToken(board,ART.m_king,[0,2],'enemy-token');
    const queen=addToken(board,ART.g_queen,[1,2]);
    addToken(board,ART.g_king,[2,2]);
    enemyKing.classList.add('king-danger');
    addLabel(queen);
    mark([[1,2]], [[0,1],[0,3],[1,1],[1,3]]);
    mission.textContent=choose('완성된 체크메이트 포지션입니다. 근위대장은 임금님이 지켜서 몽골 칸이 잡을 수 없어요.','This is checkmate. The king protects the queen, so the Mongol Khan cannot capture it.');
    if(note) note.innerHTML=choose('파란 테두리는 <b>임금님이 지키는 근위대장</b>이에요. 빨간 테두리의 탈출 칸은 근위대장이 모두 노리고 있어요.','The blue outline marks the <b>protected queen</b>. The queen attacks every red escape square.');
    document.getElementById('nextBtn').disabled=false;
    return;
  }

  if(lesson.id==='smothered'){
    const enemyKing=addToken(board,ART.m_king,[0,4],'enemy-token');
    const knight=addToken(board,ART.g_knight,[2,3]);
    const blockedSquares=[[0,3],[1,3],[1,4]];
    blockedSquares.forEach((position)=>addToken(board,ART.m_pawn,position,'enemy-token'));
    enemyKing.classList.add('king-danger');
    addLabel(knight);
    mark(blockedSquares, [[0,4]]);
    mission.textContent=choose('완성된 질식 체크메이트 포지션입니다. 몽골 칸의 도망길은 자기 편이 모두 막고 있어요.','This is smothered mate. The Mongol Khan’s own pieces block every escape square.');
    if(note) note.innerHTML=choose('파란 테두리는 <b>몽골 기물이 막은 칸</b>, 빨간 테두리는 <b>백마 기수가 체크하는 칸</b>이에요.','Blue marks squares <b>blocked by Mongol pieces</b>; red marks the knight’s attack.');
    document.getElementById('nextBtn').disabled=false;
    return;
  }

  const enemyKing=addToken(board,ART.m_king,[0,4],'enemy-token');
  addToken(board,ART.g_king,[2,3]);
  const rook=addToken(board,ART.g_rook,[3,0]);
  const showCompletedPosition=()=>{
    placeToken(rook,[0,0]);
    enemyKing.classList.add('king-danger');
    addLabel(rook);
    mark([[1,3],[1,4]], [[0,0],[0,1],[0,2],[0,3],[0,4]]);
    if(note) note.innerHTML=choose('테두리로 표시된 칸을 보세요. <b>임금님이 지키는 칸</b>과 <b>돌탑이 노리는 칸</b> 때문에 몽골 칸은 갈 곳이 없어요.','The outlined squares are covered by <b>our king</b> and <b>rook</b>, leaving the Mongol Khan no escape.');
  };
  const target=sqAt(board,0,0); target.classList.add('hint');
  board.addEventListener('click',event=>{
    const sq=event.target.closest('.sq'); if(!sq) return;
    if(sq!==target){ flashWrong(sq,choose('돌탑이 맨 윗줄을 노리도록 파란 점을 눌러 보세요.','Choose the blue square so the rook controls the top rank.')); return; }
    target.classList.remove('hint'); showCompletedPosition();
    celebrate(sq);
    mission.textContent=isEnglish?`Checkmate. You created ${lesson.title}.`:`체크메이트! ${lesson.title}를 만들었어요!`;
    mission.classList.add('done');
    state.checkmates[lesson.id]=true;
    document.getElementById('nextBtn').disabled=false;
  });
}

function bindScene(){
  const s=state.scene;
  const go=(n)=>{state.scene=n;render();};
  const goNext=()=>go(s===MODULE_END_SCENE ? MODULE_DONE_SCENE : s+1);
  const goBack=()=>{
    if(s===MODULE_START_SCENE){ window.parent?.postMessage({type:'easymate:return-training'}, '*'); return; }
    go(s-1);
  };
  if(s===REVIEW_SCENE){
    const nextButton=document.getElementById('reviewNext');
    document.querySelectorAll('.review-answer').forEach(button=>{
      button.onclick=()=>{
        const right=button.dataset.correct==='true';
        document.getElementById('reviewResult').textContent=right?choose('정답이에요! 다음 문제로 이어가세요.','Correct. Continue to the next question.'):choose('다시 생각해 보세요. 배운 규칙을 떠올려 볼까요?','Try again and recall the rule.');
        if(right){
          button.classList.add('done');
          document.querySelectorAll('.review-answer').forEach(answer=>answer.disabled=true);
          state.reviewScore+=1;
          nextButton.disabled=false;
          SFX.good();
        }
        else { button.classList.add('wrong'); SFX.wrong(); }
      };
    });
    nextButton.onclick=()=>{
      if(state.reviewIndex<3){ state.reviewIndex+=1; render(); return; }
      if(!reviewQuizReported){
        reviewQuizReported=true;
        window.parent?.postMessage({type:'easymate:review-quiz-complete',module:moduleId,score:state.reviewScore}, '*');
      }
      window.parent?.postMessage({type:'easymate:return-training'}, '*');
    };
    document.getElementById('reviewBack').onclick=()=>window.parent?.postMessage({type:'easymate:return-training'}, '*');
    return;
  }
  if(s===MODULE_DONE_SCENE){
    if(!moduleCompletionReported){
      moduleCompletionReported=true;
      window.parent?.postMessage({type:'easymate:tutorial-complete',module:moduleId,advance:false}, '*');
    }
    document.getElementById('completeModuleBtn').onclick=()=>{
      window.parent?.postMessage({type:'easymate:tutorial-complete',module:moduleId,advance:true}, '*');
    };
    return;
  }
  if(s===0){ document.getElementById('startBtn').onclick=goNext; return; }
  if(s===GOAL_SCENE){ document.getElementById('prevBtn').onclick=goBack; document.getElementById('nextBtn').onclick=goNext; return; }
  if(s>=PIECE_START_SCENE&&s<PIECE_START_SCENE+totalPieceScenes){
    setupBoard(PIECES[s-PIECE_START_SCENE],goNext); document.getElementById('prevBtn').onclick=goBack; return;
  }
  if(s>=CAPTURE_START_SCENE&&s<CHECK_START_SCENE){
    const capture=CAPTURE_SCENES[s-CAPTURE_START_SCENE]; setupCapture(capture);
    if(state.captures[capture.id]) document.getElementById('nextBtn').disabled=false;
    document.getElementById('prevBtn').onclick=goBack; document.getElementById('nextBtn').onclick=goNext; return;
  }
  if(s>=CHECK_START_SCENE&&s<CHECKMATE_START_SCENE){
    const lesson=CHECK_LESSONS[s-CHECK_START_SCENE]; setupCheck(lesson);
    if(state.checks[lesson.id]) document.getElementById('nextBtn').disabled=false;
    document.getElementById('prevBtn').onclick=goBack; document.getElementById('nextBtn').onclick=goNext; return;
  }
  if(s>=CHECKMATE_START_SCENE&&s<RECAP_SCENE){
    const lesson=CHECKMATE_LESSONS[s-CHECKMATE_START_SCENE]; setupCheckmate(lesson);
    if(state.checkmates[lesson.id]) document.getElementById('nextBtn').disabled=false;
    document.getElementById('prevBtn').onclick=goBack; document.getElementById('nextBtn').onclick=goNext; return;
  }
  if(s===RECAP_SCENE){ document.getElementById('prevBtn').onclick=goBack; document.getElementById('nextBtn').onclick=goNext; }
}
render();
</script>
