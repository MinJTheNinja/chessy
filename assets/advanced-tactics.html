<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EasyMate · 고급 전술</title>
<style>
:root{--ink:#1f3348;--muted:#657080;--line:#c9c3b6;--paper:#fffdf7;--blue:#1598c3;--red:#b4483c;--gold:#c9a24a;--light:#efe4c8;--dark:#9fbea4;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:transparent}button{font:inherit}.lesson{width:min(100%,760px);margin:0 auto;padding:8px 4px 28px}.eyebrow{color:var(--blue);font-size:.76rem;font-weight:850;letter-spacing:.05em}.top h1{margin:4px 0 8px;font-size:clamp(1.55rem,4vw,2.25rem)}.top p{max-width:650px;margin:0;color:var(--muted);line-height:1.65}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:20px 0 24px}.progress i{height:5px;background:#d9d6ce}.progress i.on{background:var(--blue)}.card{border:1px solid var(--ink);background:var(--paper);padding:clamp(18px,4vw,30px)}.card h2{margin:4px 0 8px;font-size:1.35rem}.story{margin:0 0 18px;color:var(--muted);line-height:1.65}.scene{display:grid;grid-template-columns:minmax(250px,350px) 1fr;gap:26px;align-items:center}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:1px solid var(--ink);overflow:hidden}.sq{position:relative;background:var(--light)}.sq:nth-child(16n+2),.sq:nth-child(16n+4),.sq:nth-child(16n+6),.sq:nth-child(16n+8),.sq:nth-child(16n+9),.sq:nth-child(16n+11),.sq:nth-child(16n+13),.sq:nth-child(16n+15){background:var(--dark)}.sq img{position:absolute;inset:2%;width:96%;height:96%;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.22))}.sq img.black{filter:brightness(.2) contrast(1.2) drop-shadow(0 1px 1px rgba(255,255,255,.55))}.sq.mark{box-shadow:inset 0 0 0 4px var(--gold)}.concept{border-left:3px solid var(--blue);padding-left:14px;line-height:1.6}.concept strong{display:block;margin-bottom:5px}.choices{display:grid;gap:8px;margin-top:18px}.choices button{min-height:44px;padding:9px 12px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:750;text-align:left;cursor:pointer}.choices button:hover,.choices button:focus-visible{background:#eef7f9}.choices button.good{border-color:#2f6b62;background:#eaf4ec;color:#24564f}.choices button.bad{border-color:var(--red);background:#fbefed;color:#8c342c}.feedback{min-height:24px;margin:12px 0 0;font-weight:750}.actions{display:flex;justify-content:flex-end;margin-top:18px}.next{min-height:44px;padding:0 20px;border:1px solid var(--ink);background:var(--ink);color:white;font-weight:850;cursor:pointer}.next:disabled{opacity:.35;cursor:not-allowed}.done{text-align:center;padding:36px 22px}.done .seal{display:grid;width:78px;height:78px;margin:0 auto 14px;place-items:center;border:2px solid var(--red);border-radius:50%;color:var(--red);font-size:2rem;font-weight:900}.done h2{font-size:1.7rem}.done p{color:var(--muted);line-height:1.7}.done .actions{justify-content:center;gap:10px}.secondary{min-height:44px;padding:0 18px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:800;cursor:pointer}.review-question{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.review-question h3{margin:0 0 10px;font-size:1rem}.review-results{font-size:1.2rem;font-weight:850;color:var(--blue)}
@media(max-width:650px){.scene{grid-template-columns:1fr}.board{width:min(100%,380px);margin:0 auto}.lesson{padding-inline:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="lesson" id="app"></main>
<script>
const params=new URLSearchParams(location.search);
const moduleId=Math.min(6,Math.max(5,Number(params.get('module'))||5));
const lang=params.get('lang')==='en'?'en':'ko';
const review=params.get('review')==='1';
const edition=params.get('edition')==='original'?'original':'cheoinseong';
document.documentElement.lang=lang;
const T=(ko,en)=>lang==='en'?en:ko;
const DATA={
5:{title:T('핀과 스큐어','Pins and Skewers'),lead:T('한 줄에 선 기물의 순서를 읽으면, 움직일 수 없는 수비수와 그 뒤의 더 큰 표적이 보입니다.','Read the order of pieces on a line to find a frozen defender or a larger target behind it.'),scenes:[
{name:T('봉수대의 저격','The Beacon Sniper'),story:T('고려의 돌탑이 몽골 나이트를 겨눕니다. 나이트 뒤에는 칸이 있어 움직이는 순간 왕이 공격받습니다.','A Goryeo rook aims at a Mongol knight. The Khan stands behind it, so the knight cannot move.'),concept:T('절대 핀','Absolute pin'),detail:T('킹 앞의 기물은 공격선을 열 수 없으므로 사실상 묶여 있습니다.','A piece in front of its king is effectively frozen because moving would expose check.'),pieces:[['e8','m_king'],['e6','m_knight'],['e1','g_rook'],['g1','g_king']],mark:['e8','e6','e1'],q:T('몽골 나이트가 자유롭게 움직일 수 있을까요?','Can the Mongol knight move freely?'),choices:[T('아니요. 칸이 체크에 노출됩니다.','No. It would expose the Khan to check.'),T('네. 나이트는 기물을 뛰어넘습니다.','Yes. Knights can jump.')],answer:0},
{name:T('성벽 뒤의 장수','The Commander Behind the Wall'),story:T('승병의 대각선 앞에 몽골 룩이 있고, 그 뒤에는 더 값진 퀸이 있습니다.','A Mongol rook stands on the monk soldier’s diagonal, with a more valuable queen behind it.'),concept:T('상대 핀','Relative pin'),detail:T('앞 기물은 움직일 수 있지만 뒤의 더 큰 기물을 잃게 됩니다.','The front piece may move, but doing so loses the more valuable piece behind it.'),pieces:[['h8','m_queen'],['f6','m_rook'],['b2','g_bishop'],['g1','g_king'],['a8','m_king']],mark:['h8','f6','b2'],q:T('룩이 움직이면 무엇을 잃나요?','What is lost if the rook moves?'),choices:[T('뒤에 있는 몽골 퀸','The Mongol queen behind it'),T('고려의 임금','The Goryeo king')],answer:0},
{name:T('관문을 꿰뚫는 창','The Spear Through the Gate'),story:T('체크를 받은 칸이 비키자 같은 공격선 뒤의 퀸이 드러납니다.','The checked Khan moves aside, revealing the queen farther down the same line.'),concept:T('스큐어','Skewer'),detail:T('더 중요한 기물을 먼저 공격해 비키게 한 뒤, 뒤의 기물을 잡습니다. 핀과 표적 순서가 반대입니다.','Attack the more valuable piece first; after it moves, capture the piece behind it. The target order is the reverse of a pin.'),pieces:[['a8','m_king'],['c8','m_queen'],['h8','g_rook'],['g1','g_king']],mark:['a8','c8','h8'],q:T('핀과 다른 핵심은 무엇일까요?','What makes this different from a pin?'),choices:[T('더 중요한 기물이 앞에 있어 먼저 비켜야 합니다.','The more valuable piece is in front and must move first.'),T('나이트만 사용할 수 있습니다.','Only a knight can use it.')],answer:0}
],questions:[
[T('킹 앞 기물을 움직일 수 없게 묶는 전술은?','What freezes a piece in front of its king?'),[T('절대 핀','Absolute pin'),T('포크','Fork')],0],
[T('값진 기물이 앞, 작은 기물이 뒤에 있는 공격은?','The valuable piece is in front and a lesser piece behind. Which tactic?'),[T('스큐어','Skewer'),T('상대 핀','Relative pin')],0],
[T('상대 핀의 앞 기물은 규칙상 움직일 수 있나요?','Can the front piece in a relative pin legally move?'),[T('네, 하지만 뒤 기물을 잃을 수 있어요.','Yes, but the rear piece may be lost.'),T('아니요, 항상 불법이에요.','No, it is always illegal.')],0],
[T('긴 공격선을 주로 만드는 기물 조합은?','Which pieces commonly create long attack lines?'),[T('룩·비숍·퀸','Rook, bishop, and queen'),T('킹·나이트만','Only king and knight')],0]
]},
6:{title:T('숨은 공격과 메이트','Hidden Attacks and Mates'),lead:T('가려진 공격선을 열고, 왕의 탈출칸 모양을 읽어 서로 다른 체크메이트 패턴을 구분합니다.','Open a hidden attack line and read escape-square patterns to distinguish common mating nets.'),scenes:[
{name:T('매복문이 열리다','The Ambush Gate Opens'),story:T('앞에 있던 승병이 움직이는 순간 뒤의 돌탑 공격선이 열리며 칸을 체크합니다.','When the monk soldier moves, the rook behind it suddenly gives check along the opened file.'),concept:T('디스커버드 어택','Discovered attack'),detail:T('앞 기물이 비켜 숨겨진 뒤 기물의 공격을 드러냅니다. 앞 기물도 별도의 표적을 노리면 이중 위협이 됩니다.','The front piece moves to reveal an attack from the piece behind it. If the moving piece attacks another target, it creates a double threat.'),pieces:[['e8','m_king'],['e5','g_bishop'],['e1','g_rook'],['g1','g_king'],['b8','m_queen']],mark:['e8','e5','e1'],q:T('숨겨져 있던 공격을 실제로 만드는 기물은?','Which piece supplies the hidden attack?'),choices:[T('뒤의 고려 룩','The Goryeo rook behind'),T('몽골 칸','The Mongol Khan')],answer:0},
{name:T('칸의 숨 막히는 투구','The Khan’s Sealed Helmet'),story:T('칸의 주변 칸을 자기 병사들이 막고, 백마 기수의 체크는 뛰어넘어 들어옵니다.','The Khan’s own troops block every nearby square while the knight’s check jumps into the fortress.'),concept:T('질식 체크메이트','Smothered mate'),detail:T('왕이 자기 기물에 둘러싸였을 때 나이트 체크로 끝내는 전형적인 모양입니다.','A knight delivers mate to a king boxed in by its own pieces.'),pieces:[['h8','m_king'],['g8','m_rook'],['g7','m_pawn'],['h7','m_pawn'],['f7','g_knight'],['g1','g_king']],mark:['h8','g8','g7','h7','f7'],q:T('이 메이트에서 도주를 막는 데 가장 크게 기여한 쪽은?','Who contributes most to blocking the escape squares?'),choices:[T('몽골 칸 자신의 기물','The Khan’s own pieces'),T('빈 칸','Empty squares')],answer:0},
{name:T('성벽을 닫는 두 돌탑','Two Towers Close the Wall'),story:T('한 룩이 옆줄을 막고 다른 룩이 체크하며 칸을 끝줄로 밀어냅니다. 뒷줄 메이트와 사다리 메이트의 모양도 함께 익힙니다.','One rook seals a rank while the other checks, driving the Khan toward the edge. This connects ladder and back-rank mating patterns.'),concept:T('사다리·뒷줄 메이트','Ladder and back-rank mate'),detail:T('룩 두 개는 평행한 선을 번갈아 닫습니다. 왕 앞 폰이 도주칸을 막으면 한 룩만으로도 뒷줄 메이트가 됩니다.','Two rooks alternate parallel barriers. If pawns block the king’s escapes, one rook can finish with a back-rank mate.'),pieces:[['e8','m_king'],['d7','m_pawn'],['e7','m_pawn'],['f7','m_pawn'],['a6','g_rook'],['b5','g_rook'],['g1','g_king']],mark:['e8','a6','b5'],q:T('두 룩을 사용할 때 핵심은?','What is the key idea with two rooks?'),choices:[T('한 줄씩 번갈아 막아 공간을 줄입니다.','Alternate barriers to shrink the king’s space.'),T('항상 두 룩을 같은 칸에 둡니다.','Always put both rooks on one square.')],answer:0}
],questions:[
[T('앞 기물이 비켜 뒤 기물의 공격을 여는 전술은?','What reveals an attack by moving the front piece?'),[T('디스커버드 어택','Discovered attack'),T('스테일메이트','Stalemate')],0],
[T('질식 메이트의 마지막 체크를 자주 담당하는 기물은?','Which piece commonly delivers smothered mate?'),[T('나이트','Knight'),T('폰','Pawn')],0],
[T('왕 앞 폰들이 도주를 막아 끝줄에서 당하는 메이트는?','What mate occurs when pawns trap their king on the back rank?'),[T('뒷줄 메이트','Back-rank mate'),T('앙파상','En passant')],0],
[T('사다리 메이트에서 룩 두 개는 어떻게 협력하나요?','How do two rooks cooperate in a ladder mate?'),[T('평행한 줄을 번갈아 닫습니다.','They alternate closing parallel lines.'),T('서로를 나이트처럼 지킵니다.','They defend like knights.')],0]
]}}
const data=DATA[moduleId],app=document.getElementById('app');let step=0,answered=false;
function art(name){if(edition==='original'){const [side,type]=name.split('_');const f={pawn:'p',rook:'r',knight:'n',bishop:'b',queen:'q',king:'k'}[type];return `/assets/original-chess-pieces-v1/${f}.webp?v=20260905-webp`}return `/assets/tutorial-pieces/${name}.webp?v=20260905-webp`}
function squareIndex(s){return (8-Number(s[1]))*8+(s.charCodeAt(0)-97)}
function boardHtml(scene){const by=new Map(scene.pieces.map(([s,p])=>[squareIndex(s),p]));const marked=new Set(scene.mark.map(squareIndex));return `<div class="board" aria-label="${T('전술 예시 보드','Tactical example board')}">${Array.from({length:64},(_,i)=>`<div class="sq${marked.has(i)?' mark':''}">${by.has(i)?`<img class="${by.get(i).startsWith('m_')?'black':''}" alt="" src="${art(by.get(i))}">`:''}</div>`).join('')}</div>`}
function progress(){return `<div class="progress" aria-hidden="true">${Array.from({length:4},(_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>`}
function renderLesson(){answered=false;if(step>=data.scenes.length){renderDone();return}const s=data.scenes[step];app.innerHTML=`<header class="top"><span class="eyebrow">${T(`모듈 ${moduleId} · 전술 훈련`,`Module ${moduleId} · Tactical training`)}</span><h1>${data.title}</h1><p>${data.lead}</p></header>${progress()}<section class="card"><div class="scene">${boardHtml(s)}<div><span class="eyebrow">${s.name}</span><h2>${s.concept}</h2><p class="story">${s.story}</p><div class="concept"><strong>${T('전술 원리','Tactical idea')}</strong>${s.detail}</div><div class="choices">${s.choices.map((c,i)=>`<button type="button" data-choice="${i}">${c}</button>`).join('')}</div><p class="feedback" aria-live="polite"></p><div class="actions"><button class="next" type="button" disabled>${step===data.scenes.length-1?T('모듈 마치기','Finish module'):T('다음 전술','Next tactic')}</button></div></div></div></section>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answerLesson(Number(b.dataset.choice)));app.querySelector('.next').onclick=()=>{step++;renderLesson();top?.scrollTo?.(0,0)};reportHeight()}
function answerLesson(choice){if(answered)return;const s=data.scenes[step],buttons=[...app.querySelectorAll('[data-choice]')],ok=choice===s.answer;buttons[choice].classList.add(ok?'good':'bad');if(!ok){app.querySelector('.feedback').textContent=T('다시 생각해 보세요. 공격선과 왕의 도주칸을 확인하세요.','Try again. Check the attack line and the king’s escape squares.');return}answered=true;buttons[s.answer].classList.add('good');app.querySelector('.feedback').textContent=T('정답입니다. 모양을 기억해 두세요.','Correct. Remember this pattern.');app.querySelector('.next').disabled=false}
function renderDone(){app.innerHTML=`<header class="top"><span class="eyebrow">${T(`모듈 ${moduleId} 완료`,`Module ${moduleId} complete`)}</span><h1>${data.title}</h1></header>${progress()}<section class="card done"><div class="seal">✓</div><h2>${T('전술 지도가 넓어졌어요','Your tactical map has expanded')}</h2><p>${T('새 모티프를 익혔습니다. 퍼즐에서는 공격선과 도주칸을 먼저 찾으세요.','You learned new motifs. In puzzles, identify attack lines and escape squares first.')}</p><div class="actions"><button class="secondary" type="button" data-home>${T('훈련 목록','Training list')}</button><button class="next" type="button" data-next>${moduleId<6?T('다음 모듈','Next module'):T('완료','Done')}</button></div></section>`;parent.postMessage({type:'easymate:tutorial-complete',module:moduleId,advance:false},'*');app.querySelector('[data-home]').onclick=()=>parent.postMessage({type:'easymate:return-training'},'*');app.querySelector('[data-next]').onclick=()=>parent.postMessage({type:'easymate:tutorial-complete',module:moduleId,advance:true},'*');reportHeight()}
function renderReview(){let score=0,done=0;app.innerHTML=`<header class="top"><span class="eyebrow">${T(`모듈 ${moduleId} · 복습`,`Module ${moduleId} · Review`)}</span><h1>${data.title}</h1><p>${T('네 문제로 전술 모양을 다시 확인합니다.','Check the tactical patterns with four questions.')}</p></header><section class="card">${data.questions.map((q,qi)=>`<article class="review-question"><h3>${qi+1}. ${q[0]}</h3><div class="choices">${q[1].map((c,ci)=>`<button type="button" data-q="${qi}" data-a="${ci}">${c}</button>`).join('')}</div></article>`).join('')}<div class="actions"><button class="next" type="button" disabled data-finish>${T('결과 보기','See results')}</button></div></section>`;app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const qi=Number(b.dataset.q);if(app.querySelector(`[data-q="${qi}"].good, [data-q="${qi}"].bad`))return;const ok=Number(b.dataset.a)===data.questions[qi][2];b.classList.add(ok?'good':'bad');if(ok)score++;done++;if(done===data.questions.length)app.querySelector('[data-finish]').disabled=false});app.querySelector('[data-finish]').onclick=()=>{parent.postMessage({type:'easymate:review-quiz-complete',module:moduleId,score},'*');app.innerHTML=`<section class="card done"><div class="seal">${score}</div><h2>${T(`4문제 중 ${score}문제 정답`,`You scored ${score} out of 4`)}</h2><p class="review-results">${score===4?T('모든 전술 모양을 정확히 구분했어요.','You identified every tactical pattern.'):T('틀린 모양을 한 번 더 살펴보세요.','Review the patterns you missed once more.')}</p><div class="actions"><button class="next" type="button" data-home>${T('훈련 목록으로','Back to training')}</button></div></section>`;app.querySelector('[data-home]').onclick=()=>parent.postMessage({type:'easymate:return-training'},'*');reportHeight()};reportHeight()}
function reportHeight(){requestAnimationFrame(()=>parent.postMessage({type:'easymate:tutorial-height',height:document.documentElement.scrollHeight},'*'))}
addEventListener('resize',reportHeight);review?renderReview():renderLesson();
</script>
</body>
</html>
